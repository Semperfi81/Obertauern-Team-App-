};
const IDEA_AREAS = ["Zeit", "Dienstplan", "Aufgaben", "Listen", "Chat", "Auswertung", "Sonstiges"];
function IdeasView({ S, me, isAdmin, act }) {
  const [text, setText] = useState("");
  const [area, setArea] = useState("");
  const [pending, setPending] = useState([]);
  const [sending, setSending] = useState(false);
  const [filter, setFilter] = useState("offen");
  const [viewer, setViewer] = useState(null);
  const [replyFor, setReplyFor] = useState(null);
  const [reply, setReply] = useState("");
  const all = S.ideas || [];
  const list = all.filter((i) => filter === "alle" || (filter === "offen" ? i.status === "neu" || i.status === "geplant" : i.status === "erledigt" || i.status === "nein"));
  async function send() {
    if (!text.trim() && !pending.length) return;
    setSending(true);
    try { await act("/ideas", { method: "POST", body: { text: text.trim(), area, photos: pending } }); setText(""); setPending([]); setArea(""); } catch (e) {}
    setSending(false);
  }
  const setStatus = (i, status) => act("/ideas/" + i.id, { method: "PATCH", body: { status } }).catch(() => {});
  async function del(i) { if (confirm("Notiz löschen?")) await act("/ideas/" + i.id, { method: "DELETE" }).catch(() => {}); }
  async function saveReply(i) { await act("/ideas/" + i.id, { method: "PATCH", body: { reply } }).catch(() => {}); setReplyFor(null); setReply(""); }
  function exportCSV() {
    const out = [["Datum", "Von", "Bereich", "Status", "Idee / Notiz", "Antwort", "Fotos"]];
    all.slice().sort((a, b) => a.at - b.at).forEach((i) => out.push([new Date(i.at).toLocaleString("de-AT"), i.authorName, i.area || "", IDEA_STATUS[i.status].label, i.text, i.reply || "", (i.photos || []).length]));
    downloadCSV(`ideen_notizen_${todayISO()}.csv`, out);
  }
  return (
    <div>
      <Panel className="mb-4">
        <h3 className="text-sm font-medium mb-1">💡 Neue Idee oder Notiz</h3>
        <p className="text-xs mb-3" style={{ color: COLORS.textDim }}>{isAdmin ? "Was fehlt, was nervt, was ist gut? Alles sammeln – im Frühjahr wird ausgewertet." : "Hast du eine Idee, was in der App besser sein könnte, oder stört dich etwas? Schreib es hier – die Admins sehen es."}</p>
        <textarea value={text} onChange={(e) => setText(e.target.value)} rows={3} placeholder="z. B. Im Dienstplan wäre eine Monatsansicht praktisch …" className="w-full px-3 py-2 rounded-lg mb-2" style={inputStyle} />
        {pending.length > 0 && (
          <div className="flex gap-2 mb-2">
            {pending.map((u, i) => (
              <div key={i} className="relative">
                <img src={u} alt="" className="w-16 h-16 object-cover rounded-lg" />
                <button onClick={() => setPending(pending.filter((_, j) => j !== i))} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full text-[10px]" style={{ background: COLORS.danger, color: "#fff" }}>✕</button>
              </div>
            ))}
          </div>
        )}
        <div className="flex gap-2 flex-wrap items-center">
          <div className="w-40"><Select value={area} onChange={setArea}><option value="">Bereich (optional)</option>{IDEA_AREAS.map((a) => <option key={a} value={a}>{a}</option>)}</Select></div>
          <PhotoPickButtons compact disabled={pending.length >= 4} onPick={(arr) => setPending([...pending, ...arr].slice(0, 4))} />
          <Btn onClick={send} disabled={(!text.trim() && !pending.length) || sending} className="ml-auto">{sending ? "…" : "Speichern"}</Btn>
        </div>
      </Panel>

      <div className="flex items-center justify-between gap-2 mb-3 flex-wrap">
        <Segmented value={filter} onChange={setFilter} options={[{ id: "offen", label: "Offen" }, { id: "fertig", label: "Abgeschlossen" }, { id: "alle", label: "Alle" }]} />
        {isAdmin && all.length > 0 && <Btn kind="ghost" onClick={exportCSV} className="text-xs">⬇ CSV</Btn>}
      </div>
      {list.length === 0 && <Empty>{isAdmin ? "Noch keine Ideen oder Notizen." : "Du hast noch nichts eingetragen."}</Empty>}
      <div className="space-y-2">
        {list.map((i) => {
          const st = IDEA_STATUS[i.status] || IDEA_STATUS.neu;
          const mine = i.authorId === S.myAuthorId;
          return (
            <Panel key={i.id} className="py-3">
              <div className="flex items-center justify-between gap-2 mb-1">
                <span className="text-xs" style={{ color: COLORS.textDim }}><b translate="no" style={{ color: COLORS.text }}>{i.authorName}</b>{" · "}{new Date(i.at).toLocaleDateString(window.I18N.locale, { day: "2-digit", month: "2-digit", year: "2-digit" })}{i.area ? <span>{" · "}{i.area}</span> : null}</span>
                <span className="text-[11px] px-2 py-0.5 rounded-full" style={{ background: st.color + "22", color: st.color }}>{st.label}</span>
              </div>
              {i.text && <p className="text-sm whitespace-pre-wrap" translate="no">{i.text}</p>}
              {(i.photos || []).length > 0 && <div className="flex gap-2 mt-2 flex-wrap">{i.photos.map((pid) => <Photo key={pid} id={pid} className="w-20 h-20" onClick={setViewer} />)}</div>}
              {i.reply && <p className="text-xs mt-2 px-2.5 py-1.5 rounded-lg" style={{ background: COLORS.bg, color: COLORS.accent2 }}><span>↳ Antwort: </span><span translate="no">{i.reply}</span></p>}
              {replyFor === i.id && (
                <div className="flex gap-2 mt-2">
                  <TextInput value={reply} onChange={(e) => setReply(e.target.value)} placeholder="Antwort an den Mitarbeiter…" />
                  <Btn onClick={() => saveReply(i)}>OK</Btn>
                </div>
              )}
              <div className="flex gap-1.5 mt-2 flex-wrap">
                {isAdmin && Object.keys(IDEA_STATUS).filter((k) => k !== i.status).map((k) => (
                  <button key={k} onClick={() => setStatus(i, k)} className="text-[11px] px-2 py-1 rounded-md" style={{ border: `1px solid ${IDEA_STATUS[k].color}66`, color: IDEA_STATUS[k].color }}>→ {IDEA_STATUS[k].label}</button>
                ))}
                {isAdmin && !mine && <button onClick={() => { setReplyFor(replyFor === i.id ? null : i.id); setReply(i.reply || ""); }} className="text-[11px] px-2 py-1 rounded-md" style={{ border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textDim }}>↳ Antworten</button>}
                {(isAdmin || mine) && <button onClick={() => del(i)} className="text-[11px] px-2 py-1 rounded-md ml-auto" style={{ color: COLORS.danger }}>🗑</button>}
              </div>
            </Panel>
          );
        })}
      </div>
      {viewer && <PhotoViewer url={viewer} onClose={() => setViewer(null)} />}
    </div>
  );
}

function BoardView({ S, me, isAdmin, act }) {
  const [edit, setEdit] = useState(null);
  const [locFilter, setLocFilter] = useState("");
  const [who, setWho] = useState(""); // "" = alle sichtbaren, "all" = für alle, sonst Mitarbeiter-ID
  const [showDone, setShowDone] = useState(false);
  const today = todayISO();
  const empName = (id) => (S.employees.find((e) => e.id === id) || {}).name;
  const weekAgo = Date.now() - 7 * 864e5;
  const tasks = S.tasks.filter((t) => (!locFilter || t.location === locFilter) && (!who || (who === "all" ? !t.employeeId : t.employeeId === who)));
  const prioRank = { hoch: 0, normal: 1, niedrig: 2 };
  const sortTasks = (a, b) => (prioRank[a.priority] ?? 1) - (prioRank[b.priority] ?? 1) || (a.due || "9999").localeCompare(b.due || "9999");

  async function move(t, dir) {
    const i = WORKFLOW_COLS.findIndex((c) => c.id === t.status);
    const next = WORKFLOW_COLS[i + dir];
    if (next) await act("/tasks/" + t.id, { method: "PATCH", body: { status: next.id } }).catch(() => {});
  }

  return (
    <div>
      <div className="flex gap-2 mb-4 flex-wrap items-center">
        {isAdmin && <Btn onClick={() => setEdit({})}>+ Neue Aufgabe</Btn>}
        <div className="w-44"><Select value={locFilter} onChange={setLocFilter} className="text-sm"><option value="">Alle Standorte</option>{S.locations.map((l) => <option key={l} value={l}>{l}</option>)}</Select></div>
        {isAdmin ? (
          <div className="w-44"><Select value={who} onChange={setWho} className="text-sm">
            <option value="">Alle Aufgaben</option>
            <option value="all">👥 Für alle</option>
            {S.employees.filter((e) => e.active).map((e) => <option key={e.id} value={e.id}>👤 {e.name}</option>)}
          </Select></div>
        ) : (
          <Segmented value={who} onChange={setWho} options={[{ id: "", label: "Alle" }, { id: me, label: "👤 Für mich" }, { id: "all", label: "👥 Für alle" }]} />
        )}
      </div>
      {!isAdmin && <p className="text-[11px] -mt-2 mb-3" style={{ color: COLORS.textDim }}>Du siehst Aufgaben, die dir zugeteilt sind, und Aufgaben für alle.</p>}
      <div className="grid sm:grid-cols-3 gap-3">
        {WORKFLOW_COLS.map((col) => {
          let colTasks = tasks.filter((t) => t.status === col.id).sort(sortTasks);
          let hidden = 0;
          if (col.id === "fertig" && !showDone) {
            const recent = colTasks.filter((t) => (t.doneAt || t.createdAt || 0) >= weekAgo);
            hidden = colTasks.length - recent.length; colTasks = recent;
          }
          return (
            <div key={col.id} className="rounded-xl p-3" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
              <div className="flex items-center justify-between mb-3">
                <h4 className="text-sm font-medium">{col.label}</h4>
                <span className="text-xs px-1.5 py-0.5 rounded-full" style={{ background: COLORS.bg, color: COLORS.textDim }}>{colTasks.length}</span>
              </div>
              <div className="space-y-2 min-h-[48px]">
                {colTasks.map((t) => {
                  const overdue = t.due && t.due < today && t.status !== "fertig";
                  return (
                    <div key={t.id} className="p-2.5 rounded-lg" style={{ background: t.status === "fertig" ? DONE_GREEN + "14" : COLORS.bg, border: `1px solid ${t.status === "fertig" ? DONE_GREEN + "55" : COLORS.panelBorder}`, borderLeft: `3px solid ${t.status === "fertig" ? DONE_GREEN : (PRIO[t.priority] || PRIO.normal).color}` }}>
                      <button onClick={() => setEdit({ task: t })} className="text-left w-full">
                        <p className="text-sm font-medium" style={{ color: t.status === "fertig" ? DONE_GREEN : COLORS.text }}>{t.status === "fertig" ? "✓ " : ""}{t.title}</p>
                        {t.description && <p className="text-xs mt-0.5 line-clamp-2" style={{ color: COLORS.textDim }}>{t.description}</p>}
                      </button>
                      <div className="flex items-center justify-between mt-1.5 gap-2">
                        <div className="flex items-center gap-1.5 flex-wrap text-[11px]" style={{ color: COLORS.textDim }}>
                          <span style={{ color: t.employeeId ? (t.employeeId === me ? COLORS.accent2 : COLORS.textDim) : COLORS.accent }}>{t.employeeId ? (t.employeeId === me ? "👤 Für mich" : `👤 ${empName(t.employeeId) || "?"}`) : "👥 Für alle"}</span>
                          {t.due && <span style={{ color: overdue ? COLORS.danger : COLORS.textDim }}>📅 {fmtDateShort(t.due)}</span>}
                          <LocTag loc={t.location} />
                          {(t.photos || []).length > 0 && <span>📷 {t.photos.length}</span>}
                        </div>
                        <div className="flex items-center gap-1 flex-shrink-0">
                          {col.id === "fertig" && <span className="text-[10px]" style={{ color: DONE_GREEN }} title="wird morgen automatisch gelöscht">🗑 morgen</span>}
                          {col.id === "arbeit" && <button onClick={() => move(t, -1)} className="w-7 h-7 rounded-md" style={{ color: COLORS.textDim, border: `1px solid ${COLORS.panelBorder}` }} title="Zurück">‹</button>}
                          {col.id !== "fertig" && <button onClick={() => move(t, 1)} className="w-7 h-7 rounded-md" style={{ color: COLORS.accent2, border: `1px solid ${COLORS.accent2}` }} title="Weiter">›</button>}
                        </div>
                      </div>
                    </div>
                  );
                })}
                {hidden > 0 && <button onClick={() => setShowDone(true)} className="text-xs underline" style={{ color: COLORS.textDim }}>+ {hidden} ältere anzeigen</button>}
              </div>
            </div>
          );
        })}
      </div>
      {edit && <TaskModal S={S} act={act} isAdmin={isAdmin} me={me} task={edit.task} onClose={() => setEdit(null)} />}
    </div>
  );
}

function TaskModal({ S, act, isAdmin, me, task: initialTask, onClose }) {
  // immer die aktuelle Version der Aufgabe verwenden (z. B. nach Foto-Upload)
  const task = initialTask ? S.tasks.find((t) => t.id === initialTask.id) || initialTask : null;
  const [pending, setPending] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [viewer, setViewer] = useState(null);
  const [remind, setRemind] = useState(false);
  async function addPhotos(urls) {
    if (!task) { setPending([...pending, ...urls].slice(0, 20)); return; }
    setUploading(true);
    for (const u of urls) { try { await act("/tasks/" + task.id + "/photos", { method: "POST", body: { dataUrl: u } }); } catch (e) { break; } }
    setUploading(false);
  }
  async function removePhoto(pid) {
    if (!confirm("Foto entfernen?")) return;
    await act("/tasks/" + task.id + "/photos/" + pid, { method: "DELETE" }).catch(() => {});
  }
  const [f, setF] = useState({
    title: task ? task.title : "", description: task ? task.description || "" : "",
    employeeId: task ? task.employeeId || "" : (isAdmin ? "" : me || ""), location: task ? task.location || "" : "",
    due: task ? task.due || "" : "", priority: task ? task.priority || "normal" : "normal",
    status: task ? task.status : "offen",
  });
  const set = (k) => (v) => setF((p) => ({ ...p, [k]: v && v.target ? v.target.value : v }));
  async function save() {
    if (!f.title.trim()) return;
    const body = isAdmin ? { ...f, employeeId: f.employeeId || null, location: f.location || null, due: f.due || null } : { status: f.status };
    try {
      const saved = await act(task ? "/tasks/" + task.id : "/tasks", { method: task ? "PATCH" : "POST", body });
      if (!task && pending.length && saved && saved.id) {
        setUploading(true);
        for (const u of pending) { try { await act("/tasks/" + saved.id + "/photos", { method: "POST", body: { dataUrl: u } }); } catch (e) { break; } }
        setUploading(false);
      }
      onClose();
    } catch (e) {}
  }
  async function del() {
    if (!confirm("Aufgabe löschen?")) return;
    try { await act("/tasks/" + task.id, { method: "DELETE" }); onClose(); } catch (e) {}
  }
  return (
    <Modal onClose={onClose} wide>
      <h3 className="text-sm font-medium mb-3">{task ? "Aufgabe" : "Neue Aufgabe"}</h3>
      {!isAdmin && <p className="text-[11px] mb-3" style={{ color: COLORS.textDim }}>Aufgaben werden von den Admins gestellt. Du kannst den Status ändern und Fotos hinzufügen.</p>}
      <Field label="Titel"><TextInput value={f.title} onChange={set("title")} autoFocus={!task} disabled={!isAdmin} placeholder="z. B. Leihski für Reservierung herrichten" /></Field>
      <Field label="Beschreibung">
        <textarea value={f.description} onChange={set("description")} disabled={!isAdmin} rows={3} className="w-full px-3 py-2 rounded-lg" style={isAdmin ? inputStyle : { ...inputStyle, opacity: 0.6 }} placeholder={isAdmin ? "optional" : ""} />
      </Field>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Zuständig">
          <Select value={f.employeeId} onChange={set("employeeId")} disabled={!isAdmin}>
            <option value="">👥 Für alle (sieht jeder)</option>
            {S.employees.filter((e) => e.active && (isAdmin || e.id === me)).map((e) => <option key={e.id} value={e.id}>👤 {e.name}{isAdmin ? " (nur sichtbar für sie/ihn)" : ""}</option>)}
          </Select>
        </Field>
        <Field label="Standort">
          <Select value={f.location} onChange={set("location")} disabled={!isAdmin}><option value="">–</option>{S.locations.map((l) => <option key={l} value={l}>{l}</option>)}</Select>
        </Field>
        <Field label="Fällig am"><TextInput type="date" value={f.due} onChange={set("due")} disabled={!isAdmin} className="disabled:opacity-60" /></Field>
        <Field label="Priorität">
          <Select value={f.priority} onChange={set("priority")} disabled={!isAdmin}>{Object.entries(PRIO).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</Select>
        </Field>
      </div>
      {task && task.status === "fertig" && !isAdmin && (
        <p className="text-xs mb-3 px-3 py-2 rounded-lg" style={{ background: DONE_GREEN + "1a", color: DONE_GREEN }}>✓ Erledigt – wird morgen automatisch gelöscht.</p>
      )}
      {task && (task.status !== "fertig" || isAdmin) && (
        <Field label={task.status === "fertig" ? "Status (nur Admin: zur Korrektur wieder öffnen)" : "Status"}>
          <Select value={f.status} onChange={set("status")}>{WORKFLOW_COLS.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}</Select>
        </Field>
      )}
      <div className="mb-4">
        <div className="flex items-center justify-between mb-2">
          <span className="text-xs" style={{ color: COLORS.textDim }}>📷 Fotos zur Dokumentation {uploading && "· wird hochgeladen…"}</span>
          <PhotoPickButtons disabled={uploading} onPick={addPhotos} />
        </div>
        <div className="flex flex-wrap gap-2">
          {task && (task.photos || []).map((ph) => (
            <div key={ph.id} className="relative">
              <Photo id={ph.id} className="w-20 h-20" onClick={setViewer} />
              <div className="text-[9px] mt-0.5 w-20 truncate" style={{ color: COLORS.textDim }}>{ph.byName} · {new Date(ph.at).toLocaleDateString(window.I18N.locale, { day: "2-digit", month: "2-digit" })}</div>
              {(isAdmin || ph.by === me) && <button onClick={() => removePhoto(ph.id)} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full text-[10px]" style={{ background: COLORS.danger, color: "#fff" }}>✕</button>}
            </div>
          ))}
          {!task && pending.map((u, i) => (
            <div key={i} className="relative">
              <img src={u} alt="" className="w-20 h-20 object-cover rounded-lg" />
              <button onClick={() => setPending(pending.filter((_, j) => j !== i))} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full text-[10px]" style={{ background: COLORS.danger, color: "#fff" }}>✕</button>
            </div>
          ))}
          {((task && !(task.photos || []).length) || (!task && !pending.length)) && <span className="text-xs" style={{ color: COLORS.textDim }}>Noch keine Fotos – z. B. Schaden, Vorher/Nachher, Lieferung.</span>}
        </div>
      </div>
      <div className="flex gap-2">
        <Btn onClick={save} disabled={uploading} className="flex-1">Speichern</Btn>
        {task && isAdmin && <Btn kind="ghost" onClick={del}>🗑</Btn>}
        <Btn kind="ghost" onClick={onClose}>Abbrechen</Btn>
      </div>
      {task && (
        <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${COLORS.panelBorder}` }}>
          <div className="flex items-center justify-between gap-2">
            <span className="text-xs" style={{ color: COLORS.textDim }}>⏰ {(S.reminders || []).filter((r) => r.taskId === task.id && r.active).map((r) => fmtWhen(r.nextAt)).join(", ") || "Keine Erinnerung"}</span>
            <Btn kind="ghost" className="text-xs" onClick={() => setRemind(true)}>⏰ Erinnerung setzen</Btn>
          </div>
        </div>
      )}
      {task && task.doneAt && <p className="text-[11px] mt-2" style={{ color: COLORS.textDim }}>Erledigt am {new Date(task.doneAt).toLocaleString(window.I18N.locale)}</p>}
      {viewer && <PhotoViewer url={viewer} onClose={() => setViewer(null)} />}
      {remind && task && <ReminderModal S={S} isAdmin={isAdmin} act={act} onClose={() => setRemind(false)}
        init={{ text: task.title, taskId: task.id, date: task.due && task.due >= todayISO() ? task.due : undefined, time: task.due ? "08:00" : undefined, target: isAdmin ? task.employeeId || "all" : "self" }} />}
    </Modal>
  );
}

function TodosView({ S, me, isAdmin, act }) {
  const [text, setText] = useState("");
  const [due, setDue] = useState("");
  const [forEmployee, setForEmployee] = useState(me || "");
  useEffect(() => { if (me) setForEmployee(me); }, [me]);
  const active = S.employees.filter((e) => e.active);
  const list = [...S.todos].sort((a, b) => Number(a.done) - Number(b.done) || (a.due || "9999").localeCompare(b.due || "9999"));
  async function submit() {
    if ((isAdmin && !forEmployee) || !text.trim()) return;
    try { await act("/todos", { method: "POST", body: { employeeId: forEmployee, text, due } }); setText(""); setDue(""); } catch (e) {}
  }
  return (
    <div>
      <Panel className="mb-4">
        <div className="flex flex-col sm:flex-row gap-2">
          {isAdmin && <div className="sm:w-40"><Select value={forEmployee} onChange={setForEmployee}><option value="" disabled>Für wen?</option>{active.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}</Select></div>}
          <TextInput value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Neues To-Do…" className="flex-1" />
          <div className="sm:w-40"><TextInput type="date" value={due} onChange={(e) => setDue(e.target.value)} /></div>
          <Btn onClick={submit}>+ Hinzufügen</Btn>
        </div>
      </Panel>
      <div className="space-y-2">
        {list.length === 0 && <Empty>Keine To-Dos vorhanden.</Empty>}
        {list.map((t) => {
          const emp = S.employees.find((e) => e.id === t.employeeId);
          return (
            <Panel key={t.id} className="flex items-center justify-between py-2.5">
              <div className="flex items-center gap-3">
                <button onClick={() => act("/todos/" + t.id + "/toggle", { method: "PATCH" }).catch(() => {})} className="w-6 h-6 rounded-md flex items-center justify-center flex-shrink-0"
                  style={{ border: `1.5px solid ${t.done ? COLORS.accent2 : COLORS.panelBorder}`, background: t.done ? COLORS.accent2 : "transparent" }}>
                  {t.done && <span style={{ color: "#0E1411", fontSize: 12 }}>✓</span>}
                </button>
                <div>
                  <p className="text-sm" style={{ textDecoration: t.done ? "line-through" : "none", color: t.done ? COLORS.textDim : COLORS.text }}>{t.text}</p>
                  <div className="flex items-center gap-2 text-xs mt-0.5" style={{ color: COLORS.textDim }}>
                    {emp && <span>👤 {emp.name}</span>}
                    {t.due && <span>📅 {fmtDateShort(t.due)}</span>}
                  </div>
                </div>
              </div>
              {isAdmin && <button onClick={() => act("/todos/" + t.id, { method: "DELETE" }).catch(() => {})} style={{ color: COLORS.textDim }}>🗑</button>}
            </Panel>
          );
        })}
      </div>
    </div>
  );
}

function ChecklistItemRow({ tpl, item, c, date, act, onToggle, onView, empName }) {
  const cam = useRef(null);
  const [busy, setBusy] = useState(false);
  async function onFile(e) {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setBusy(true);
    try { const dataUrl = await compressImage(f); await act("/checklists/photo", { method: "POST", body: { templateId: tpl.id, item, date, dataUrl } }); }
    catch (err) {} finally { setBusy(false); }
  }
  return (
    <div className="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg" style={{ background: COLORS.bg }}>
      <button onClick={onToggle} className="flex-1 flex items-center gap-2.5 py-0.5 text-left min-w-0">

        <span className="flex-1 text-sm" style={{ color: c ? COLORS.textDim : COLORS.text }}>{item}</span>
        {c && <span className="text-[10px] text-right flex-shrink-0" style={{ color: COLORS.textDim }}>{c.byName || empName(c.by)}<br />{fmtClock(c.at)}</span>}
      </button>
      {c && c.photo ? (
        <Photo id={c.photo} className="w-10 h-10 flex-shrink-0" onClick={onView} />
      ) : (
        <>
          <input ref={cam} type="file" accept="image/*" capture="environment" className="hidden" onChange={onFile} />
          <button onClick={() => cam.current.click()} disabled={busy} title="Foto als Nachweis" className="w-9 h-9 rounded-lg flex-shrink-0 text-sm" style={{ border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textDim }}>{busy ? "…" : "📷"}</button>
        </>
      )}

  );

                  </div>

                    <div className="flex items-center justify-between gap-2 mt-2 text-xs">
                      <span style={{ color: COLORS.accent2 }}>✓ Abgeschlossen{lastAt ? <span>{" · " + new Date(lastAt).toLocaleDateString(window.I18N.locale, { day: "2-digit", month: "2-digit", year: "2-digit" })}</span> : null}</span>

                    </div>

                    <div className="mt-3 space-y-1">
                      {tpl.items.map((item) => (

  const [items, setItems] = useState(tpl ? tpl.items.join("\n") : "");

    if (!confirm("Checkliste inkl. Verlauf löschen?")) return;

  }
  return (

      <Field label="Bereich"><Select value={area} onChange={setArea}>{areaOptions.map((a) => <option key={a} value={a}>{a}</option>)}</Select></Field>

function monthStats(S, emp, ym) { return periodStats(S, emp, monthDays(ym)); }
// Auswertung für beliebigen Zeitraum (Tag, Woche, Monat)
function periodStats(S, emp, dates) {
  const inP = new Set(dates);
  const entries = S.timeEntries.filter((e) => e.employeeId === emp.id && inP.has(e.date));
  const byDay = {};
  entries.forEach((e) => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  let net = 0, brk = 0, lunch = 0;
  const planned = S.shifts.filter((s) => s.employeeId === emp.id && inP.has(s.date)).reduce((a, s) => a + shiftMs(s), 0);
  const warnings = [];
  Object.keys(byDay).forEach((d) => {
    const x = dayStats(S, emp.id, d);
    net += x.net; brk += x.brk; lunch += x.lunch;
    if (!String(emp.id).startsWith("admin:") && x.net > 6 * 3600000 && x.brk + x.lunch < 30 * 60000) warnings.push(`${fmtDateShort(d)}: >6 h ohne 30 Min Pause`);
    if (x.net > 10 * 3600000) warnings.push(`${fmtDateShort(d)}: über 10 h`);
  });
  entries.filter((e) => e.end === null && e.date < todayISO()).forEach((e) => warnings.push(`${fmtDateShort(e.date)}: nicht ausgestempelt`));
  const absDays = (type) => dates.filter((d) => (S.absences || []).some((a) => a.employeeId === emp.id && a.type === type && a.status === "genehmigt" && absCovers(a, d))).length;
  const urlaub = absDays("urlaub"), krank = absDays("krank");
  return { entries, days: Object.keys(byDay).length, net, brk, lunch, planned, warnings, urlaub, krank };
}

const isAdminId = (id) => String(id).startsWith("admin:");

function MonthView({ S, mode = "staff" }) {
  const [ym, setYm] = useState(todayISO().slice(0, 7));
  const [kind, setKindState] = useState(() => store.get("team-app-period") || "monat");
  const setKind = (k) => { setKindState(k); store.set("team-app-period", k); };
  const [day, setDay] = useState(todayISO());
  const [monday, setMonday] = useState(mondayOf(todayISO()));
  const dates = kind === "tag" ? [day] : kind === "woche" ? weekDays(monday) : monthDays(ym);
  const inP = new Set(dates);
  const from = dates[0], to = dates[dates.length - 1];
  const periodLabel = kind === "tag" ? fmtDateLong(day) : kind === "woche" ? `${fmtDateShort(from)} – ${fmtDateShort(to)}` : fmtMonth(ym);
  const periodKey = kind === "tag" ? day : kind === "woche" ? `woche_${from}_bis_${to}` : ym;
  const periodText = kind === "tag" ? parseISO(day).toLocaleDateString("de-AT") : kind === "woche" ? `${parseISO(from).toLocaleDateString("de-AT")} – ${parseISO(to).toLocaleDateString("de-AT")}` : ym;
  const admins = mode === "admins";
  const hasEntries = (id) => S.timeEntries.some((t) => t.employeeId === id && inP.has(t.date));
  // Mitarbeiter-Auswertung ohne Admins – Admin-Zeiten werden getrennt ausgewertet
  const emps = admins ? adminPersons(S) : S.employees.filter((e) => e.active || hasEntries(e.id));
  const prefix = admins ? "admin-stunden" : "stunden";
  const rows = emps.map((e) => ({ e, ...periodStats(S, e, dates) }));

  function exportSummary() {
    const out = [[admins ? "Admin" : "Mitarbeiter", "Zeitraum", "Arbeitstage", "Netto (Std)", "Pausen gestempelt (Std)", ...(admins ? [] : ["Mittagspause automatisch (Std)", "Urlaubstage", "Krankentage"]), "Geplant (Std)", "Differenz (Std)", "Hinweise"]];
    rows.forEach((r) => out.push([r.e.name, periodText, r.days, fmtHours(r.net), fmtHours(r.brk), ...(admins ? [] : [fmtHours(r.lunch), r.urlaub, r.krank]), fmtHours(r.planned), r.planned ? fmtHours(r.net - r.planned) : "", r.warnings.join(" | ")]));
    downloadCSV(`${prefix}_${periodKey}_zusammenfassung.csv`, out);
  }
  function exportDetail() {
    const out = [[admins ? "Admin" : "Mitarbeiter", "Datum", "Wochentag", "Beginn", "Ende", "Pause gestempelt (Min)", ...(admins ? [] : ["Mittagspause automatisch (Min)"]), "Netto (Std)", "Standort", "Notiz", "Korrigiert von"]];
    const seen = new Set();
    S.timeEntries.filter((e) => inP.has(e.date) && isAdminId(e.employeeId) === admins).sort((a, b) => personName(S, a.employeeId).localeCompare(personName(S, b.employeeId)) || a.date.localeCompare(b.date) || a.start - b.start).forEach((e) => {
      // Mittagspause einmal pro Tag (beim ersten Eintrag des Tages) abziehen
      const key = e.employeeId + "|" + e.date;
      let lunch = 0;
      if (!seen.has(key)) { seen.add(key); lunch = dayStats(S, e.employeeId, e.date).lunch; }
      out.push([personName(S, e.employeeId), parseISO(e.date).toLocaleDateString("de-AT"), fmtDateShort(e.date).split(",")[0], fmtClock(e.start), e.end ? fmtClock(e.end) : "läuft", Math.round(entryBreakMs(e) / 60000), ...(admins ? [] : [lunch ? Math.round(lunch / 60000) : ""]), fmtHours(Math.max(0, entryNetMs(e) - lunch)), e.location || "", e.note || "", e.editedBy || ""]);
    });
    downloadCSV(`${prefix}_${periodKey}_details.csv`, out);
  }

  return (
    <div>
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <Segmented value={kind} onChange={setKind} options={[{ id: "tag", label: "Tag" }, { id: "woche", label: "Woche" }, { id: "monat", label: "Monat" }]} />
        {kind === "tag" && <div className="w-44"><TextInput type="date" value={day} onChange={(e) => e.target.value && setDay(e.target.value)} /></div>}
        {kind === "woche" && <WeekNav monday={monday} setMonday={setMonday} />}
        {kind === "monat" && <div className="w-44"><TextInput type="month" value={ym} onChange={(e) => e.target.value && setYm(e.target.value)} /></div>}
      </div>
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <Btn kind="ghost" onClick={exportSummary} className="text-xs">⬇ CSV Zusammenfassung</Btn>
        <Btn kind="ghost" onClick={exportDetail} className="text-xs">⬇ CSV Details</Btn>
      </div>
      <Panel className="p-0 overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-xs text-left" style={{ color: COLORS.textDim }}>
              <th className="p-3 font-medium">{periodLabel}</th>
              <th className="p-3 font-medium text-right">Tage</th>
              <th className="p-3 font-medium text-right">Netto</th>
              <th className="p-3 font-medium text-right hidden sm:table-cell">Pause</th>
              {!admins && <th className="p-3 font-medium text-right" title="automatisch abgezogene Mittagspause">🍽 Mittag</th>}
              <th className="p-3 font-medium text-right">Geplant</th>
              <th className="p-3 font-medium text-right">Diff.</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => {
              const diff = r.net - r.planned;
              return (
                <React.Fragment key={r.e.id}>
                  <tr style={{ borderTop: `1px solid ${COLORS.panelBorder}` }}>
                    <td className="p-3">{r.e.name}{r.warnings.length > 0 && <span title={r.warnings.join("\n")} style={{ color: COLORS.warn }}> ⚠</span>}
                      {(r.urlaub > 0 || r.krank > 0) && <div className="text-[11px]" style={{ color: COLORS.textDim }}>{r.urlaub > 0 && `🏖 ${r.urlaub} T. `}{r.krank > 0 && `🤒 ${r.krank} T.`}</div>}</td>
                    <td className="p-3 text-right tabular-nums">{r.days}</td>
                    <td className="p-3 text-right tabular-nums font-medium">{fmtHours(r.net)}</td>
                    <td className="p-3 text-right tabular-nums hidden sm:table-cell" style={{ color: COLORS.textDim }}>{fmtHours(r.brk)}</td>
                    {!admins && <td className="p-3 text-right tabular-nums" style={{ color: COLORS.textDim }}>{r.lunch ? fmtHours(r.lunch) : "–"}</td>}
                    <td className="p-3 text-right tabular-nums" style={{ color: COLORS.textDim }}>{r.planned ? fmtHours(r.planned) : "–"}</td>
                    <td className="p-3 text-right tabular-nums" style={{ color: !r.planned ? COLORS.textDim : diff >= 0 ? COLORS.accent2 : COLORS.danger }}>{r.planned ? (diff >= 0 ? "+" : "") + fmtHours(diff) : "–"}</td>
                  </tr>
                  {r.warnings.length > 0 && (
                    <tr><td colSpan={admins ? 6 : 7} className="px-3 pb-2 text-[11px]" style={{ color: COLORS.warn }}>{r.warnings.join(" · ")}</td></tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </Panel>
      <p className="text-[11px] mt-2" style={{ color: COLORS.textDim }}>Stunden als Dezimalzahl (7,50 = 7 h 30 min). Netto = nach Abzug der Pausen{admins ? " (keine automatische Mittagspause bei Admin-Zeiten)" : " und der automatischen Mittagspause"}{admins ? "" : S.lunch && S.lunch.enabled ? ` (${S.lunch.minutes} Min ab ${String(S.lunch.minHours).replace(".", ",")} h Arbeit, gestempelte Pausen werden angerechnet)` : " (ausgeschaltet)"}. CSV öffnet direkt in Excel.</p>
    </div>
  );
}

function EntriesView({ S, act, mode = "staff" }) {
  const admins = mode === "admins";
  const people = admins ? adminPersons(S) : S.employees;
  const [empId, setEmpId] = useState(admins ? S.myAuthorId : (S.employees[0] || {}).id || "");
  const [ym, setYm] = useState(todayISO().slice(0, 7));
  const [edit, setEdit] = useState(null);
  const canEdit = (id) => !isAdminId(id) || id === S.myAuthorId; // fremde Admin-Zeiten nur ansehen
  const entries = S.timeEntries.filter((e) => e.employeeId === empId && e.date.startsWith(ym)).sort((a, b) => b.date.localeCompare(a.date) || b.start - a.start);
  const openOld = S.timeEntries.filter((e) => e.end === null && e.date < todayISO() && (admins ? e.employeeId === S.myAuthorId : !isAdminId(e.employeeId)));
  // Mittagspause beim ersten Eintrag des Tages anzeigen
  const lunchFor = {};
  [...entries].sort((a, b) => a.start - b.start).forEach((e) => { if (!(e.date in lunchFor)) lunchFor[e.date] = { id: e.id, ms: dayStats(S, empId, e.date).lunch }; });
  return (
    <div>
      {openOld.length > 0 && (
        <Panel className="mb-4" style={{ borderColor: COLORS.warn }}>
          <p className="text-sm mb-2" style={{ color: COLORS.warn }}>⚠ Vergessen auszustempeln:</p>

            <button key={e.id} onClick={() => setEdit({ entry: e })} className="block text-xs underline mb-1" style={{ color: COLORS.text }}>

      <div className="flex gap-2 mb-4 flex-wrap">

        <div className="w-44"><TextInput type="month" value={ym} onChange={(e) => e.target.value && setYm(e.target.value)} /></div>
        <Btn onClick={() => setEdit({ employeeId: empId })} disabled={!empId || !canEdit(empId)}>+ Eintrag nachtragen</Btn>
      </div>
      <div className="space-y-1.5">

        {entries.map((e) => (

// Bild im Browser verkleinern (max. 1600 px, JPEG) – spart Speicher & Datenvolumen
function compressImage(file, maxSide = 1600, quality = 0.78) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error("Bitte ein Foto auswählen."));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Foto konnte nicht gelesen werden.")); };
    img.src = url;
  });
}

// Geschützte Fotos mit Anmelde-Token laden und zwischenspeichern
const photoCache = new Map();
function usePhotoUrl(id) {
  const [url, setUrl] = useState(() => photoCache.get(id) || null);
  useEffect(() => {
    if (!id || photoCache.has(id)) { setUrl(photoCache.get(id) || null); return; }
    let alive = true;
    fetch("/api/photos/" + id, { headers: { Authorization: "Bearer " + store.get(TOKEN_KEY) } })
      .then((r) => (r.ok ? r.blob() : null))
      .then((b) => { if (b) { const u = URL.createObjectURL(b); photoCache.set(id, u); if (alive) setUrl(u); } })
      .catch(() => {});
    return () => { alive = false; };
  }, [id]);
  return url;
}

const REPEAT_LABEL = { none: "einmalig", daily: "täglich (Mo–So)", weekly: "wöchentlich (gleicher Wochentag)", weekdays: "nur Mo–Fr" };
let audioCtx = null;
// Audio muss nach einer Berührung freigeschaltet werden (Browser-Regel)
if (typeof window !== "undefined") {
  const unlock = () => { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) {} };
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
}
function playAlarm(times = 3) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + 0.05;
    for (let i = 0; i < times; i++) {
      [880, 1175].forEach((f, j) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = f;
        const st = t0 + i * 0.7 + j * 0.18;
        g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.4, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.16);
        o.connect(g).connect(audioCtx.destination); o.start(st); o.stop(st + 0.18);
      });
    }
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]); } catch (e) {}
}
function isMyReminder(S, r) {
  if (r.target === "all") return true;
  if (r.target === "self") return r.createdBy === S.myAuthorId;
  return r.target === S.myAuthorId;
}
function reminderTargetLabel(S, r) {
  if (r.target === "self") return r.createdBy === S.myAuthorId ? "für mich" : "für " + r.createdByName;
  if (r.target === "all") return "für alle";
  return "für " + ((S.employees.find((e) => e.id === r.target) || {}).name || "?");
}
function fmtWhen(ms) {
  if (!ms) return "–";
  const d = new Date(ms), iso = localISO(d);
  const day = iso === todayISO() ? "Heute" : iso === addDays(todayISO(), 1) ? "Morgen" : fmtDateShort(iso);
  return `${day}, ${hmOf(ms)}`;
}

// Zeigt fällige Erinnerungen in der offenen App mit Signalton an
function ReminderAlarm({ S }) {
  const [current, setCurrent] = useState(null);
  useEffect(() => {
    if (current) return;
    let seen = {};
    try { seen = JSON.parse(localStorage.getItem("team-app-rem-seen") || "{}"); } catch (e) {}
    const due = (S.reminders || []).find((r) => r.lastFiredAt && Date.now() - r.lastFiredAt < 15 * 60000 && isMyReminder(S, r) && seen[r.id] !== r.lastFiredAt);
    if (due) { setCurrent(due); playAlarm(); }
  }, [S.reminders, current]);
  if (!current) return null;
  function ok() {
    try {
      const seen = JSON.parse(localStorage.getItem("team-app-rem-seen") || "{}");
      seen[current.id] = current.lastFiredAt;
      Object.keys(seen).forEach((k) => { if (Date.now() - seen[k] > 2 * 864e5) delete seen[k]; });
      localStorage.setItem("team-app-rem-seen", JSON.stringify(seen));
    } catch (e) {}
    setCurrent(null);
  }
  const task = current.taskId ? S.tasks.find((t) => t.id === current.taskId) : null;
  return (
    <div className="fixed inset-0 z-[70] flex items-center justify-center px-4" style={{ background: "rgba(0,0,0,0.75)" }}>
      <div className="w-full max-w-sm rounded-2xl p-5 text-center" style={{ background: COLORS.panel, border: `2px solid ${COLORS.accent}` }}>
        <div className="text-5xl mb-2">⏰</div>
        <h3 className="text-lg font-semibold mb-1">Erinnerung</h3>
        <p className="text-base mb-1">{current.text}</p>
        {task && <p className="text-sm mb-1" style={{ color: COLORS.textDim }}>📋 {task.title}</p>}
        <p className="text-xs mb-4" style={{ color: COLORS.textDim }}>{reminderTargetLabel(S, current)} · von {current.createdByName}</p>
        <div className="flex gap-2">
          <Btn kind="ghost" onClick={() => playAlarm(1)} className="px-3">🔔</Btn>
          <Btn onClick={ok} className="flex-1 py-3">OK, erledigt</Btn>
        </div>
      </div>
    </div>
  );
}

function RemindersView({ S, isAdmin, act }) {
  const [edit, setEdit] = useState(null);
  const list = [...(S.reminders || [])];
  const active = list.filter((r) => r.active).sort((a, b) => a.nextAt - b.nextAt);
  const past = list.filter((r) => !r.active).sort((a, b) => (b.lastFiredAt || 0) - (a.lastFiredAt || 0)).slice(0, 20);
  const canEdit = (r) => isAdmin || r.createdBy === S.myAuthorId;
  const Row = ({ r }) => {
    const task = r.taskId ? S.tasks.find((t) => t.id === r.taskId) : null;
    return (
      <button onClick={() => canEdit(r) && setEdit({ reminder: r })} className="w-full text-left px-3 py-2.5 rounded-lg flex items-center justify-between gap-3" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, opacity: r.active ? 1 : 0.55 }}>
        <span className="min-w-0">
          <span className="block text-sm truncate">{r.text}</span>
          <span className="block text-[11px]" style={{ color: COLORS.textDim }}>
            {reminderTargetLabel(S, r)} · {REPEAT_LABEL[r.repeat] || "einmalig"}{task ? ` · 📋 ${task.title}` : ""}{r.createdBy !== S.myAuthorId ? ` · von ${r.createdByName}` : ""}
          </span>
        </span>
        <span className="text-xs text-right flex-shrink-0 tabular-nums" style={{ color: r.active ? COLORS.accent : COLORS.textDim }}>{r.active ? "⏰ " + fmtWhen(r.nextAt) : "✓ " + fmtWhen(r.lastFiredAt)}</span>
      </button>
    );
  };
  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <Btn onClick={() => setEdit({})}>+ Neue Erinnerung</Btn>
        <Btn kind="ghost" onClick={() => playAlarm(1)} className="text-xs">🔔 Ton testen</Btn>
      </div>
      <p className="text-[11px] mb-3" style={{ color: COLORS.textDim }}>Zur eingestellten Zeit kommt eine Benachrichtigung mit Ton aufs Handy (Benachrichtigungen müssen aktiviert sein). Ist die App offen, erscheint zusätzlich ein Hinweis mit Signalton.</p>
      <div className="space-y-1.5 mb-5">
        {active.length === 0 && <Empty>Keine anstehenden Erinnerungen.</Empty>}
        {active.map((r) => <Row key={r.id} r={r} />)}
      </div>
      {past.length > 0 && (
        <>
          <h4 className="text-xs uppercase tracking-wider mb-2" style={{ color: COLORS.textDim }}>Erledigt</h4>
          <div className="space-y-1.5">{past.map((r) => <Row key={r.id} r={r} />)}</div>
        </>
      )}
      {edit && <ReminderModal S={S} isAdmin={isAdmin} act={act} init={edit} onClose={() => setEdit(null)} />}
    </div>
  );
}

function ReminderModal({ S, isAdmin, act, init, onClose }) {
  const r = init.reminder;
  const inOneHour = new Date(Date.now() + 3600000);
  const [f, setF] = useState({
    text: r ? r.text : init.text || "",
    date: r ? r.date : init.date || localISO(inOneHour),
    time: r ? r.time : init.time || `${pad(inOneHour.getHours())}:${pad(Math.floor(inOneHour.getMinutes() / 5) * 5)}`,
    repeat: r ? r.repeat : "none",
    target: r ? r.target : init.target || "self",
    taskId: r ? r.taskId || null : init.taskId || null,
  });
  const [err, setErr] = useState("");
  const set = (k) => (v) => setF((p) => ({ ...p, [k]: v && v.target ? v.target.value : v }));
  const task = f.taskId ? S.tasks.find((t) => t.id === f.taskId) : null;
  async function save() {
    setErr("");
    try { await api(r ? "/reminders/" + r.id : "/reminders", { method: r ? "PATCH" : "POST", token: store.get(TOKEN_KEY), body: f }); await act("/state").catch(() => {}); onClose(); }
    catch (e) { setErr(e.message); }
  }
  async function del() {
    if (!confirm("Erinnerung löschen?")) return;
    try { await act("/reminders/" + r.id, { method: "DELETE" }); onClose(); } catch (e) {}
  }
  const quick = [["In 15 Min", 15], ["In 1 Std", 60], ["Morgen 8:00", "m8"]];
  function setQuick(q) {
    let d;
    if (q === "m8") { d = new Date(); d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0); }
    else d = new Date(Date.now() + q * 60000);
    setF((p) => ({ ...p, date: localISO(d), time: hmOf(d.getTime()) }));
  }
  return (
    <Modal onClose={onClose}>
      <h3 className="text-sm font-medium mb-3">{r ? "Erinnerung bearbeiten" : "⏰ Neue Erinnerung"}</h3>
      {task && <p className="text-xs mb-2" style={{ color: COLORS.textDim }}>📋 zur Aufgabe: {task.title}</p>}
      <Field label="Woran erinnern?"><TextInput value={f.text} onChange={set("text")} autoFocus placeholder="z. B. Skischuhtrockner ausschalten" /></Field>
      <div className="flex gap-1.5 mb-3 flex-wrap">{quick.map(([l, q]) => <button key={l} onClick={() => setQuick(q)} className="text-xs px-2.5 py-1 rounded-full" style={{ border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textDim }}>{l}</button>)}</div>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Datum"><TextInput type="date" value={f.date} onChange={set("date")} /></Field>
        <Field label="Uhrzeit"><TextInput type="time" value={f.time} onChange={set("time")} /></Field>
      </div>
      <Field label="Wiederholen">
        <Select value={f.repeat} onChange={set("repeat")}>{Object.entries(REPEAT_LABEL).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</Select>
      </Field>
      {isAdmin && (
        <Field label="Für wen?">
          <Select value={f.target} onChange={set("target")}>
            <option value="self">Nur für mich</option>
            <option value="all">👥 Für alle</option>
            {S.employees.filter((e) => e.active).map((e) => <option key={e.id} value={e.id}>👤 {e.name}</option>)}
          </Select>
        </Field>
      )}
      {err && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{err}</p>}
      <div className="flex gap-2">
        <Btn onClick={save} className="flex-1">Speichern</Btn>
        {r && <Btn kind="ghost" onClick={del}>🗑</Btn>}
        <Btn kind="ghost" onClick={onClose}>Abbrechen</Btn>
      </div>
    </Modal>
  );
}

// =====================================================================
// GRUPPENCHAT
// =====================================================================
const CHAT_READ_KEY = "team-app-chat-read";
function chatUnread(S) {
  let last = 0;
  try { last = Number(localStorage.getItem(CHAT_READ_KEY) || 0); } catch (e) {}
  return (S.messages || []).filter((m) => m.at > last && m.authorId !== S.myAuthorId).length;
}

function ChatTab({ S, isAdmin, act, token }) {
  const [text, setText] = useState("");
  const [pending, setPending] = useState([]); // Fotos, die noch gesendet werden
  const [viewer, setViewer] = useState(null);
  const [sending, setSending] = useState(false);
  const listRef = useRef(null);
  const toBottom = () => { const el = listRef.current; if (el) el.scrollTop = el.scrollHeight; };
  const msgs = S.messages || [];
  const lastId = msgs.length ? msgs[msgs.length - 1].id : "";

  // Als gelesen markieren und nach unten scrollen, wenn neue Nachrichten kommen
  useEffect(() => {
    try { localStorage.setItem(CHAT_READ_KEY, String(Date.now())); } catch (e) {}
    const el = listRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [lastId]);

  async function send() {
    const t = text.trim();
    if ((!t && !pending.length) || sending) return;
    setSending(true);
    try { await act("/chat", { method: "POST", body: { text: t, photos: pending } }); setText(""); setPending([]); } catch (e) {}
    setSending(false);
  }
  async function del(m) {
    if (!confirm("Nachricht löschen?")) return;
    await act("/chat/" + m.id, { method: "DELETE" }).catch(() => {});
  }

  let lastDate = "";
  return (
    <>
    <PushBanner token={token} compact />
    <div className="flex flex-col rounded-xl overflow-hidden" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, height: "calc(100vh - 270px)", minHeight: 360 }}>
      <div className="px-4 py-2.5 text-sm font-medium flex items-center justify-between" style={{ borderBottom: `1px solid ${COLORS.panelBorder}` }}>
        <span>💬 Team-Chat</span>
        <span className="text-xs" style={{ color: COLORS.textDim }}>{S.employees.filter((e) => e.active).length} Mitarbeiter</span>
      </div>
      <div ref={listRef} className="flex-1 overflow-y-auto scrollbar-thin px-3 py-3 space-y-1.5">
        {msgs.length === 0 && <p className="text-sm text-center mt-8" style={{ color: COLORS.textDim }}>Noch keine Nachrichten. Schreib die erste! 👋</p>}
        {msgs.map((m, i) => {
          const mine = m.authorId === S.myAuthorId;
          const d = localISO(new Date(m.at));
          const showDate = d !== lastDate; lastDate = d;
          const prev = msgs[i - 1];
          const showName = !mine && (!prev || prev.authorId !== m.authorId || showDate);
          return (
            <React.Fragment key={m.id}>
              {showDate && (
                <div className="text-center my-2"><span className="text-[11px] px-2 py-0.5 rounded-full" style={{ background: COLORS.bg, color: COLORS.textDim }}>{d === todayISO() ? "Heute" : d === addDays(todayISO(), -1) ? "Gestern" : fmtDateShort(d)}</span></div>
              )}
              <div className={`flex ${mine ? "justify-end" : "justify-start"}`}>
                <div className="max-w-[80%] px-3 py-1.5 rounded-2xl" style={{ background: mine ? COLORS.accent2 + "33" : COLORS.bg, border: `1px solid ${mine ? COLORS.accent2 + "66" : COLORS.panelBorder}`, borderBottomRightRadius: mine ? 6 : undefined, borderBottomLeftRadius: mine ? undefined : 6 }}>
                  {showName && <div className="text-[11px] font-medium mb-0.5" style={{ color: m.isAdmin ? COLORS.accent : COLORS.accent2 }}>{m.authorName}{m.isAdmin ? " · Admin" : ""}</div>}
                  {(m.photos || []).length > 0 && (
                    <div className={`grid gap-1 my-1 ${m.photos.length > 1 ? "grid-cols-2" : "grid-cols-1"}`}>
                      {m.photos.map((pid) => <Photo key={pid} id={pid} className={m.photos.length > 1 ? "w-32 h-32" : "w-56 h-56"} onClick={setViewer} onLoad={toBottom} />)}
                    </div>
                  )}
                  {m.text && <div className="text-sm whitespace-pre-wrap break-words">{m.text}</div>}
                  <div className="text-[10px] text-right mt-0.5 flex items-center justify-end gap-2" style={{ color: COLORS.textDim }}>
                    {(mine || isAdmin) && <button onClick={() => del(m)} title="Löschen" className="opacity-60 hover:opacity-100">🗑</button>}
                    {fmtClock(m.at)}
                  </div>
                </div>
              </div>
            </React.Fragment>
          );
        })}
      </div>
      {pending.length > 0 && (
        <div className="flex gap-2 px-2 pt-2 overflow-x-auto" style={{ borderTop: `1px solid ${COLORS.panelBorder}` }}>
          {pending.map((u, i) => (
            <div key={i} className="relative flex-shrink-0">
              <img src={u} alt="" className="w-16 h-16 object-cover rounded-lg" />
              <button onClick={() => setPending(pending.filter((_, j) => j !== i))} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full text-[10px]" style={{ background: COLORS.danger, color: "#fff" }}>✕</button>
            </div>
          ))}
        </div>
      )}
      <div className="flex gap-2 p-2 items-end" style={{ borderTop: pending.length ? "none" : `1px solid ${COLORS.panelBorder}` }}>
        <PhotoPickButtons compact disabled={pending.length >= 4} onPick={(arr) => setPending([...pending, ...arr].slice(0, 4))} />
        <textarea value={text} onChange={(e) => setText(e.target.value)} rows={1} placeholder="Nachricht…"
          onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
          className="flex-1 px-3 py-2 rounded-lg resize-none" style={{ ...inputStyle, maxHeight: 120 }} />
        <Btn onClick={send} disabled={(!text.trim() && !pending.length) || sending} className="px-4">{sending ? "…" : "➤"}</Btn>
      </div>
    </div>
    {viewer && <PhotoViewer url={viewer} onClose={() => setViewer(null)} />}
    </>
  );
}

// =====================================================================
// PUSH-BENACHRICHTIGUNGEN
// =====================================================================
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function b64ToBytes(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}
async function currentSub() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
// Abo anlegen (fragt ggf. nach Erlaubnis) und beim Server speichern
async function enablePush(token) {
  if (!pushSupported()) throw new Error("Dieses Gerät/dieser Browser unterstützt keine Benachrichtigungen.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Benachrichtigungen wurden nicht erlaubt.");
  const { publicKey } = await api("/push/key");
  if (!publicKey) throw new Error("Server unterstützt noch keine Benachrichtigungen.");
  const reg = await navigator.serviceWorker.register("/service-worker.js").then(() => navigator.serviceWorker.ready);
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
  await api("/push/subscribe", { method: "POST", token, body: { subscription: sub.toJSON() } });
  return true;
}
// Nach dem Login: vorhandenes Abo dem angemeldeten Benutzer zuordnen
async function syncPush(token) {
  try {
    if (!pushSupported() || Notification.permission !== "granted") return false;
    const sub = await currentSub();
    if (!sub) return false;
    await api("/push/subscribe", { method: "POST", token, body: { subscription: sub.toJSON() } });
    return true;
  } catch (e) { return false; }
}
async function unlinkPush() {
  try { const sub = await currentSub(); if (sub) await api("/push/unsubscribe", { method: "POST", body: { endpoint: sub.endpoint } }); } catch (e) {}
}

function PushBanner({ token, compact }) {
  const [state, setState] = useState("checking"); // checking | on | off | denied | ios | unsupported
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [hidden, setHidden] = useState(() => { try { return localStorage.getItem("team-app-push-hide") === "1"; } catch (e) { return false; } });
  useEffect(() => {
    (async () => {
      if (isIOS() && !isStandalone()) return setState("ios");
      if (!pushSupported()) return setState("unsupported");
      if (Notification.permission === "denied") return setState("denied");
      const sub = await currentSub().catch(() => null);
      setState(sub && Notification.permission === "granted" ? "on" : "off");
    })();
  }, []);
  async function turnOn() {
    setBusy(true); setMsg("");
    try { await enablePush(token); setState("on"); setMsg("Aktiviert ✓"); }
    catch (e) { setMsg(e.message); if (Notification.permission === "denied") setState("denied"); }
    setBusy(false);
  }
  async function test() {
    setMsg("");
    try { const r = await api("/push/test", { method: "POST", token }); setMsg(r.sent ? "Test gesendet – kommt gleich ✓" : "Kein Abo gefunden – bitte neu aktivieren."); if (!r.sent) setState("off"); }
    catch (e) { setMsg(e.message); }
  }
  if (state === "checking") return null;
  if (state === "on") {
    if (!compact) return null;
    return (
      <div className="flex items-center justify-between gap-2 mb-3 text-xs px-3 py-2 rounded-lg" style={{ background: COLORS.accent2 + "15", color: COLORS.accent2 }}>
        <span>🔔 Benachrichtigungen aktiv {msg && <span style={{ color: COLORS.textDim }}>· {msg}</span>}</span>
        <button onClick={test} className="underline">Test</button>
      </div>
    );
  }
  if (hidden && !compact) return null;
  const box = (children) => (
    <div className="mb-3 px-3 py-2.5 rounded-lg text-xs" style={{ background: COLORS.accent + "15", border: `1px solid ${COLORS.accent}55`, color: COLORS.text }}>
      {children}
      {msg && <p className="mt-1" style={{ color: COLORS.warn }}>{msg}</p>}
    </div>
  );
  if (state === "ios") return box(<><b>🔔 Benachrichtigungen am iPhone:</b> Öffne die App über das Teilen-Symbol <b>⎋ → „Zum Home-Bildschirm“</b> und starte sie dann vom Home-Bildschirm. Danach kannst du sie hier aktivieren.</>);
  if (state === "unsupported") return compact ? box(<>Dieser Browser unterstützt keine Benachrichtigungen. Tipp: Chrome (Android) oder die installierte App am iPhone verwenden.</>) : null;
  if (state === "denied") return box(<><b>🔕 Benachrichtigungen blockiert.</b> Erlaube sie in den Browser-/Handy-Einstellungen für diese Seite und lade die App neu.</>);
  return box(
    <div className="flex items-center justify-between gap-3">
      <span><b>🔔 Benachrichtigungen aktivieren</b><br /><span style={{ color: COLORS.textDim }}>Bei neuen Chat-Nachrichten, Schichten und Aufgaben.</span></span>
      <div className="flex items-center gap-2 flex-shrink-0">
        {!compact && <button onClick={() => { setHidden(true); try { localStorage.setItem("team-app-push-hide", "1"); } catch (e) {} }} style={{ color: COLORS.textDim }} title="Ausblenden">✕</button>}
        <Btn onClick={turnOn} disabled={busy} className="text-xs py-1.5">Aktivieren</Btn>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/service-worker.js").catch(function (err) {
        console.warn("Service Worker nicht registriert:", err);
      });
    });
