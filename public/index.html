<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Crew Sport Gefäll – Team-App</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#15171C" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Team-App" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<style>
  html, body { margin:0; padding:0; background:#15171C; }
  * { box-sizing: border-box; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #2A2E38; border-radius: 4px; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #E8A33D; outline-offset: 2px; }
  input, select, textarea { font-size: 16px; } /* verhindert Zoom auf iPhone */
  @media (min-width: 640px) { input, select, textarea { font-size: 14px; } }
  input[type="date"], input[type="time"], input[type="month"] { color-scheme: dark; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  #boot-error { display:none; color:#ff8a70; background:#1a1a1a; padding:16px; font-family:monospace; font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-error"></div>
<script>
  // Zeigt Fehler nur an, wenn die App gar nicht startet
  window.addEventListener("error", function (ev) {
    if (document.getElementById("root").children.length) return;
    var box = document.getElementById("boot-error");
    box.style.display = "block";
    box.textContent = "App konnte nicht starten: " + ev.message + "\nBitte Seite neu laden.";
  });
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

const TOKEN_KEY = "team-app-token";
const LAST_EMP_KEY = "team-app-last-employee";

const COLORS = {
  bg: "#15171C", panel: "#1C1F26", panelBorder: "#2A2E38",
  accent: "#E8A33D", accent2: "#4DA8A0", text: "#E9EAEC",
  textDim: "#8C919E", danger: "#D5694B", warn: "#E0B341",
};
const LOC_COLORS = {
  "E-Bike Verleih": "#4DA8A0",
  "Trial / Funpark": "#D5694B",
  "Footgolf": "#7FB069",
  "Alpine Mini Market": "#E8A33D",
  "Allgemein": "#8C919E",
};
const locColor = (l) => LOC_COLORS[l] || COLORS.textDim;

// ---------- Datum & Zeit (immer lokale Zeit, nicht UTC) ----------
const pad = (n) => String(n).padStart(2, "0");
const localISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => localISO(new Date());
const parseISO = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return localISO(d); }
function mondayOf(iso) { const d = parseISO(iso); const day = d.getDay(); return addDays(iso, day === 0 ? -6 : 1 - day); }
function weekDays(iso) { const m = mondayOf(iso); return [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(m, i)); }
function monthDays(ym) {
  const [y, m] = ym.split("-").map(Number);
  const n = new Date(y, m, 0).getDate();
  return Array.from({ length: n }, (_, i) => `${ym}-${pad(i + 1)}`);
}
const tsFrom = (date, hm) => new Date(`${date}T${hm}:00`).getTime();
const hmOf = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const minutesOf = (hm) => { const [h, m] = hm.split(":").map(Number); return h * 60 + m; };

function fmtDuration(ms) {
  const totalMin = Math.max(0, Math.floor(ms / 60000));
  return `${Math.floor(totalMin / 60)}h ${pad(totalMin % 60)}m`;
}
const fmtHours = (ms) => (ms / 3600000).toFixed(2).replace(".", ",");
const fmtClock = (ts) => hmOf(ts);
function fmtDateShort(iso) {
  return parseISO(iso).toLocaleDateString("de-AT", { weekday: "short", day: "2-digit", month: "2-digit" });
}
function fmtDateLong(iso) {
  return parseISO(iso).toLocaleDateString("de-AT", { weekday: "long", day: "numeric", month: "long" });
}
function fmtMonth(ym) {
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("de-AT", { month: "long", year: "numeric" });
}

// ---------- Berechnungen ----------
function entryBreakMs(e, now = Date.now()) {
  if (e.manualBreakMin !== null && e.manualBreakMin !== undefined) return e.manualBreakMin * 60000;
  return (e.breaks || []).reduce((s, b) => s + ((b.end || now) - b.start), 0);
}
const entryGrossMs = (e, now = Date.now()) => (e.end || now) - e.start;
const entryNetMs = (e, now = Date.now()) => Math.max(0, entryGrossMs(e, now) - entryBreakMs(e, now));
const onBreak = (e) => !!e && e.end === null && (e.breaks || []).some((b) => b.end === null);
const shiftMs = (s) => { let d = minutesOf(s.end) - minutesOf(s.start); if (d < 0) d += 1440; return d * 60000; };

// ---------- CSV (Excel-freundlich: Semikolon, BOM für Umlaute) ----------
function downloadCSV(filename, rows) {
  const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------- API ----------
async function api(path, { method = "GET", body, token } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch("/api" + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || "Fehler bei der Anfrage."); err.data = data; throw err; }
  return data;
}
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};

// ---------- UI-Bausteine ----------
const inputStyle = { background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}`, color: COLORS.text };

function Panel({ children, className = "", style = {}, onClick }) {
  return (
    <div onClick={onClick} className={`rounded-xl p-4 ${className}`} style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, ...style }}>
      {children}
    </div>
  );
}
function Modal({ children, onClose, wide }) {
  useEffect(() => {
    const h = (e) => e.key === "Escape" && onClose && onClose();
    window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h);
  }, [onClose]);
  return (
    <div className="fixed inset-0 flex items-end sm:items-center justify-center z-50 sm:px-4" style={{ background: "rgba(0,0,0,0.65)" }}
      onMouseDown={(e) => e.target === e.currentTarget && onClose && onClose()}>
      <div className={`w-full ${wide ? "sm:max-w-lg" : "sm:max-w-sm"} max-h-[92vh] overflow-y-auto scrollbar-thin rounded-t-2xl sm:rounded-xl p-4`}
        style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
        {children}
      </div>
    </div>
  );
}
function Btn({ children, onClick, kind = "primary", className = "", disabled, title, type = "button" }) {
  const styles = {
    primary: { background: COLORS.accent, color: "#1A1A1A" },
    go: { background: COLORS.accent2, color: "#0E1411" },
    danger: { background: COLORS.danger, color: "#fff" },
    ghost: { border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textDim, background: "transparent" },
    warn: { background: COLORS.warn + "22", border: `1px solid ${COLORS.warn}`, color: COLORS.warn },
  };
  return (
    <button type={type} title={title} disabled={disabled} onClick={onClick}
      className={`flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium disabled:opacity-40 ${className}`} style={styles[kind]}>
      {children}
    </button>
  );
}
function Field({ label, children, className = "" }) {
  return (
    <label className={`block mb-3 ${className}`}>
      <span className="block text-xs mb-1" style={{ color: COLORS.textDim }}>{label}</span>
      {children}
    </label>
  );
}
function TextInput(props) {
  return <input {...props} className={`w-full px-3 py-2 rounded-lg ${props.className || ""}`} style={inputStyle} />;
}
function Select({ value, onChange, children, className = "" }) {
  return <select value={value} onChange={(e) => onChange(e.target.value)} className={`w-full px-3 py-2 rounded-lg ${className}`} style={inputStyle}>{children}</select>;
}
function Segmented({ value, onChange, options }) {
  return (
    <div className="flex gap-1 p-1 rounded-lg" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
      {options.map((o) => (
        <button key={o.id} onClick={() => onChange(o.id)} className="px-3 py-1.5 rounded-md text-xs font-medium whitespace-nowrap"
          style={{ background: value === o.id ? COLORS.accent : "transparent", color: value === o.id ? "#1A1A1A" : COLORS.textDim }}>
          {o.label}
        </button>
      ))}
    </div>
  );
}
function LocTag({ loc }) {
  if (!loc) return null;
  return <span className="text-[11px] px-1.5 py-0.5 rounded" style={{ background: locColor(loc) + "22", color: locColor(loc) }}>{loc}</span>;
}
function Empty({ children }) {
  return <p className="text-sm py-2" style={{ color: COLORS.textDim }}>{children}</p>;
}
function WeekNav({ monday, setMonday }) {
  const days = weekDays(monday);
  return (
    <div className="flex items-center gap-2">
      <button onClick={() => setMonday(addDays(monday, -7))} className="w-9 h-9 rounded-lg" style={{ border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textDim }}>‹</button>
      <div className="text-sm text-center min-w-[150px]">{fmtDateShort(days[0]).slice(4)} – {fmtDateShort(days[6]).slice(4)}</div>
      <button onClick={() => setMonday(addDays(monday, 7))} className="w-9 h-9 rounded-lg" style={{ border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textDim }}>›</button>
      {monday !== mondayOf(todayISO()) && <button onClick={() => setMonday(mondayOf(todayISO()))} className="text-xs underline" style={{ color: COLORS.accent }}>Heute</button>}
    </div>
  );
}

// ---------- Tabs ----------
const TABS = [
  { id: "zeit", label: "Zeit", icon: "🕒" },
  { id: "schichten", label: "Schichten", icon: "📅" },
  { id: "aufgaben", label: "Aufgaben", icon: "📋" },
  { id: "checklisten", label: "Listen", icon: "☑️" },
  { id: "chat", label: "Chat", icon: "💬" },
];
const ADMIN_TAB = { id: "admin", label: "Auswertung", icon: "📊" };

function App() {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [offline, setOffline] = useState(false);
  const [tab, setTab] = useState(() => {
    const t = new URLSearchParams(location.search).get("tab");
    return ["zeit", "schichten", "aufgaben", "checklisten", "chat", "admin"].includes(t) ? t : "zeit";
  });
  const [S, setS] = useState({ role: null, employees: [], timeEntries: [], todos: [], tasks: [], shifts: [], checklistTemplates: [], checklistRuns: [], locations: [], loginEmployees: [] });
  const [token, setTokenState] = useState(() => store.get(TOKEN_KEY));
  const setToken = (t) => { setTokenState(t); store.set(TOKEN_KEY, t); };
  const [authView, setAuthView] = useState(null);

  const role = S.role;
  const isAdmin = role === "admin";
  const me = S.me ? S.me.id : null;

  const refresh = useCallback(async () => {
    try {
      const d = await api("/state", { token });
      setS((prev) => ({ ...prev, ...d }));
      setOffline(false);
      if (!d.role && token) setToken(null); // Anmeldung abgelaufen / PIN geändert
    } catch (e) {
      setOffline(true);
    }
    setLoading(false);
  }, [token]);

  useEffect(() => { refresh(); }, [refresh]);
  useEffect(() => {
    const id = setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 5000);
    const onVis = () => document.visibilityState === "visible" && refresh();
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [refresh]);

  const activeEmployees = (S.employees || []).filter((e) => e.active);

  // Tippen auf eine Benachrichtigung bei offener App -> passenden Tab öffnen
  useEffect(() => {
    if (!("serviceWorker" in navigator)) return;
    const h = (ev) => {
      if (ev.data && ev.data.type === "open") {
        const t = new URL(ev.data.url, location.origin).searchParams.get("tab");
        if (t) setTab(t);
        refresh();
      }
    };
    navigator.serviceWorker.addEventListener("message", h);
    return () => navigator.serviceWorker.removeEventListener("message", h);
  }, [refresh]);
  // Nach Anmeldung vorhandenes Push-Abo dem Benutzer zuordnen
  useEffect(() => { if (role && token) syncPush(token); }, [role, token]);

  // Führt eine Änderung aus und lädt danach neu
  const act = useCallback(async (path, opts = {}) => {
    try {
      const r = await api(path, { token, ...opts });
      await refresh();
      return r;
    } catch (e) {
      if (e.data && e.data.needLogin) { setToken(null); }
      setError(e.message); throw e;
    }
  }, [token, refresh]);
  // Stempeln: Mitarbeiter immer für sich selbst, Admin für die gewählte Person
  const empAct = useCallback((employeeId, path, body = {}) => act(path, { method: "POST", body: { employeeId, ...body } }).catch(() => {}), [act]);

  function loginDone(res) {
    setToken(res.token);
    setAuthView(null); setTab("zeit"); setError("");
  }
  async function logout() {
    if (!confirm("Abmelden?")) return;
    await unlinkPush();
    if (role === "employee") await api("/logout", { method: "POST", token }).catch(() => {});
    setToken(null);
    setS((p) => ({ ...p, role: null, me: null, timeEntries: [], employees: [] }));
    setTab("zeit");
  }

  if (loading) {
    return (
      <div style={{ background: COLORS.bg }} className="min-h-screen flex items-center justify-center">
        <div className="spin" style={{ width: 28, height: 28, border: `3px solid ${COLORS.panelBorder}`, borderTopColor: COLORS.accent, borderRadius: "50%" }} />
      </div>
    );
  }

  if (!role) {
    return (
      <>
        <LoginScreen S={S} offline={offline} onDone={loginDone} openAdmin={() => setAuthView(S.adminCount === 0 ? "setup" : "login")} />
        {(authView === "setup" || authView === "login") && <AuthModal mode={authView} onDone={loginDone} onClose={() => setAuthView(null)} />}
      </>
    );
  }

  const tabs = isAdmin ? [...TABS, ADMIN_TAB] : TABS;
  const ctx = { S, me, isAdmin, token, act, empAct, setError, activeEmployees, openAdmins: () => setAuthView("manage") };
  const displayName = isAdmin ? S.adminName : (S.me || {}).name;
  const unread = chatUnread(S);

  return (
    <div style={{ background: COLORS.bg, color: COLORS.text, minHeight: "100vh" }} className="font-sans">
      <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-4 pb-24 sm:pb-8">
        <header className="flex items-center justify-between gap-3 mb-4">
          <div className="flex items-center gap-3 min-w-0">
            <img src="/icon-192.png" alt="" className="w-11 h-11 rounded-full flex-shrink-0" />
            <div className="min-w-0">
              <h1 className="text-base sm:text-lg font-semibold tracking-tight truncate">Crew Sport Gefäll</h1>
              <p className="text-xs truncate" style={{ color: COLORS.textDim }}>{fmtDateLong(todayISO())}</p>
            </div>
          </div>
          <div className="flex items-center gap-1.5 flex-shrink-0">
            {!isAdmin && (
              <button onClick={() => setAuthView("pin")} title="PIN ändern" className="px-2.5 py-1.5 rounded-full text-xs" style={{ border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textDim }}>🔑</button>
            )}
            <button onClick={logout} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium"
              style={{ background: (isAdmin ? COLORS.accent : COLORS.accent2) + "22", border: `1px solid ${isAdmin ? COLORS.accent : COLORS.accent2}`, color: isAdmin ? COLORS.accent : COLORS.accent2 }}>
              {isAdmin ? "🔓" : "👤"} {displayName}<span className="hidden sm:inline"> · Abmelden</span>
            </button>
          </div>
        </header>

        {offline && (
          <div className="mb-3 px-3 py-2 rounded-lg text-xs" style={{ background: COLORS.warn + "22", border: `1px solid ${COLORS.warn}`, color: COLORS.warn }}>
            Keine Verbindung zum Server – Anzeige ist evtl. nicht aktuell.
          </div>
        )}
        {error && (
          <div className="mb-3 px-3 py-2 rounded-lg text-xs flex justify-between gap-2" style={{ background: COLORS.danger + "22", border: `1px solid ${COLORS.danger}`, color: COLORS.danger }}>
            <span>{error}</span><button onClick={() => setError("")} className="underline">schließen</button>
          </div>
        )}
        {isAdmin && activeEmployees.length === 0 && (
          <div className="mb-4 px-3 py-2 rounded-lg text-xs" style={{ background: COLORS.accent + "18", border: `1px solid ${COLORS.accent}`, color: COLORS.accent }}>
            Noch keine Mitarbeiter – unter 📊 Auswertung → Team anlegen (mit PIN).
          </div>
        )}

        <nav className="hidden sm:flex gap-1 mb-5 p-1 rounded-xl" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
          {tabs.map(({ id, label, icon }) => (
            <button key={id} onClick={() => setTab(id)} className="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-sm font-medium"
              style={{ background: tab === id ? COLORS.accent : "transparent", color: tab === id ? "#1A1A1A" : COLORS.textDim }}>
              <span>{icon}</span><span>{label}</span>
              {id === "chat" && unread > 0 && tab !== "chat" && <span className="text-[10px] px-1.5 rounded-full" style={{ background: COLORS.danger, color: "#fff" }}>{unread}</span>}
            </button>
          ))}
        </nav>

        {tab === "zeit" && <PushBanner token={token} />}
        {tab === "zeit" && <ZeitTab {...ctx} />}
        {tab === "schichten" && <SchichtTab {...ctx} />}
        {tab === "aufgaben" && <AufgabenTab {...ctx} />}
        {tab === "checklisten" && <ChecklistenTab {...ctx} />}
        {tab === "chat" && <ChatTab {...ctx} />}
        {tab === "admin" && isAdmin && <AdminTab {...ctx} />}
      </div>

      <nav className="sm:hidden fixed bottom-0 left-0 right-0 flex z-40" style={{ background: COLORS.panel, borderTop: `1px solid ${COLORS.panelBorder}`, paddingBottom: "env(safe-area-inset-bottom)" }}>
        {tabs.map(({ id, label, icon }) => (
          <button key={id} onClick={() => setTab(id)} className="flex-1 flex flex-col items-center py-2 text-[10px] font-medium"
            style={{ color: tab === id ? COLORS.accent : COLORS.textDim }}>
            <span className="text-lg leading-none mb-0.5 relative">{icon}
              {id === "chat" && unread > 0 && tab !== "chat" && <span className="absolute -top-1 -right-2.5 text-[9px] min-w-[16px] h-4 px-1 rounded-full flex items-center justify-center" style={{ background: COLORS.danger, color: "#fff" }}>{unread > 99 ? "99+" : unread}</span>}
            </span>{label}
          </button>
        ))}
      </nav>

      {authView === "manage" && <AdminManageModal token={token} onClose={() => setAuthView(null)} />}
      {authView === "pin" && <ChangePinModal token={token} onClose={() => setAuthView(null)} />}
    </div>
  );
}

function LoginScreen({ S, offline, onDone, openAdmin }) {
  const [empId, setEmpId] = useState(() => store.get(LAST_EMP_KEY) || "");
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const list = S.loginEmployees || [];
  useEffect(() => { if (empId && !list.some((e) => e.id === empId)) setEmpId(""); }, [list.length]);
  async function submit() {
    setErr("");
    if (!empId) { setErr("Bitte deinen Namen auswählen."); return; }
    setBusy(true);
    try {
      const r = await api("/login", { method: "POST", body: { employeeId: empId, pin: pin.trim() } });
      store.set(LAST_EMP_KEY, empId);
      onDone(r);
    } catch (e) { setErr(e.message); setPin(""); }
    setBusy(false);
  }
  return (
    <div style={{ background: COLORS.bg, color: COLORS.text, minHeight: "100vh" }} className="font-sans flex items-center justify-center px-4 py-8">
      <div className="w-full max-w-sm">
        <div className="flex flex-col items-center mb-6">
          <img src="/icon-512.png" alt="" className="w-32 h-32 rounded-full mb-3" />
          <h1 className="text-xl font-semibold">Crew Sport Gefäll</h1>
          <p className="text-sm" style={{ color: COLORS.textDim }}>Team-App · Anmeldung</p>
        </div>
        {offline && <p className="text-xs mb-3 text-center" style={{ color: COLORS.warn }}>Keine Verbindung zum Server.</p>}
        <Panel>
          {list.length === 0 ? (
            <p className="text-sm mb-3" style={{ color: COLORS.textDim }}>
              {S.adminCount === 0 ? "Willkommen! Richte zuerst einen Admin ein und lege danach die Mitarbeiter an." : "Noch keine Mitarbeiter mit PIN angelegt. Ein Admin muss dich zuerst anlegen."}
            </p>
          ) : (
            <>
              <Field label="Name">
                <Select value={empId} onChange={(v) => { setEmpId(v); setErr(""); }}>

      <Field label="PIN"><TextInput type="password" inputMode="numeric" value={pin} onChange={(e) => setPin(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} /></Field>

  );
}

function ZeitTab({ S, me, isAdmin, empAct, activeEmployees }) {
  const [, setTick] = useState(0);
  const [view, setView] = useState("tag");
  const [monday, setMonday] = useState(mondayOf(todayISO()));
  useEffect(() => { const id = setInterval(() => setTick((t) => t + 1), 1000); return () => clearInterval(id); }, []);
  const today = todayISO();

  // Mitarbeiter sehen nur sich selbst. Admin: alle, wer gerade arbeitet zuerst
  const visible = isAdmin ? activeEmployees : activeEmployees.filter((e) => e.id === me);
  const sorted = [...visible].sort((a, b) => {
    const score = (e) => (e.id === me ? 0 : S.timeEntries.some((t) => t.employeeId === e.id && t.end === null) ? 1 : 2);
    return score(a) - score(b) || a.name.localeCompare(b.name);
  });
  const staleOpen = S.timeEntries.filter((e) => e.end === null && e.date < today);

  return (
    <div>
      <div className="flex items-center justify-between gap-2 mb-4 flex-wrap">
        <Segmented value={view} onChange={setView} options={[{ id: "tag", label: "🗓 Heute" }, { id: "woche", label: "📆 Woche" }]} />
        {view === "woche" && <WeekNav monday={monday} setMonday={setMonday} />}
      </div>

      {staleOpen.length > 0 && (
        <div className="mb-4 px-3 py-2 rounded-lg text-xs" style={{ background: COLORS.warn + "22", border: `1px solid ${COLORS.warn}`, color: COLORS.warn }}>
          ⚠ Nicht ausgestempelt seit Vortag: {staleOpen.map((e) => (S.employees.find((x) => x.id === e.employeeId) || {}).name).join(", ")}.
          {isAdmin ? " Unter 📊 Auswertung → Einträge korrigieren." : " Bitte Admin informieren."}
        </div>
      )}

      {sorted.length === 0 && <Empty>{isAdmin ? "Noch keine Mitarbeiter angelegt." : "Dein Konto ist nicht aktiv."}</Empty>}

      {view === "tag" ? (
        <div className="grid sm:grid-cols-2 gap-3">
          {sorted.map((emp) => <ClockCard key={emp.id} emp={emp} S={S} isMe={!isAdmin} empAct={empAct} today={today} />)}
          {!isAdmin && me && <MyMonthPanel S={S} me={me} />}
        </div>
      ) : (
        <div className="space-y-3">
          {sorted.map((emp) => {
            const days = weekDays(monday);
            const dayTotals = days.map((d) => S.timeEntries.filter((e) => e.employeeId === emp.id && e.date === d).reduce((s, e) => s + entryNetMs(e), 0));
            const weekTotal = dayTotals.reduce((a, b) => a + b, 0);
            const planned = S.shifts.filter((s) => s.employeeId === emp.id && days.includes(s.date)).reduce((a, s) => a + shiftMs(s), 0);
            const maxDay = Math.max(...dayTotals, 1);
            return (
              <Panel key={emp.id}>
                <div className="flex items-center justify-between mb-3 gap-2">
                  <h3 className="font-medium">{emp.name}</h3>
                  <span className="text-xs text-right" style={{ color: COLORS.textDim }}>
                    Netto {fmtDuration(weekTotal)}
                    {planned > 0 && <> · geplant {fmtDuration(planned)}</>}
                    {emp.weeklyHours ? <> · Soll {emp.weeklyHours}h</> : null}
                  </span>
                </div>
                <div className="grid grid-cols-7 gap-1.5">
                  {days.map((d, i) => (
                    <div key={d} className="flex flex-col items-center gap-1">
                      <div className="w-full rounded-md flex items-end" style={{ height: 56, background: COLORS.bg }}>
                        <div className="w-full rounded-md" style={{ height: `${dayTotals[i] > 0 ? Math.max((dayTotals[i] / maxDay) * 100, 8) : 0}%`, background: d === today ? COLORS.accent : COLORS.accent2 }} />
                      </div>
                      <span className="text-[10px]" style={{ color: COLORS.textDim }}>{fmtDateShort(d).split(",")[0]}</span>
                      <span className="text-[10px]" style={{ color: COLORS.textDim }}>{dayTotals[i] > 0 ? fmtHours(dayTotals[i]) : "–"}</span>
                    </div>
                  ))}
                </div>
              </Panel>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MyMonthPanel({ S, me }) {
  const ym = todayISO().slice(0, 7);
  const entries = S.timeEntries.filter((e) => e.employeeId === me && e.date.startsWith(ym));
  const net = entries.reduce((s, e) => s + entryNetMs(e), 0);
  const days = new Set(entries.map((e) => e.date)).size;
  const planned = S.shifts.filter((s) => s.employeeId === me && s.date.startsWith(ym)).reduce((a, s) => a + shiftMs(s), 0);
  return (
    <Panel>
      <h3 className="text-sm font-medium mb-2">Mein {fmtMonth(ym)}</h3>
      <div className="grid grid-cols-3 gap-2 text-center">
        <div className="rounded-lg py-2" style={{ background: COLORS.bg }}><div className="text-lg font-semibold tabular-nums">{fmtHours(net)}</div><div className="text-[11px]" style={{ color: COLORS.textDim }}>Std. netto</div></div>
        <div className="rounded-lg py-2" style={{ background: COLORS.bg }}><div className="text-lg font-semibold tabular-nums">{days}</div><div className="text-[11px]" style={{ color: COLORS.textDim }}>Arbeitstage</div></div>
        <div className="rounded-lg py-2" style={{ background: COLORS.bg }}><div className="text-lg font-semibold tabular-nums">{planned ? fmtHours(planned) : "–"}</div><div className="text-[11px]" style={{ color: COLORS.textDim }}>Std. geplant</div></div>
      </div>
    </Panel>
  );
}

function ClockCard({ emp, S, isMe, empAct, today }) {
  const running = S.timeEntries.find((e) => e.employeeId === emp.id && e.end === null);
  const paused = onBreak(running);
  const todays = S.timeEntries.filter((e) => e.employeeId === emp.id && e.date === today).sort((a, b) => b.start - a.start);
  const net = todays.reduce((s, e) => s + entryNetMs(e), 0);
  const brk = todays.reduce((s, e) => s + entryBreakMs(e), 0);
  const shift = S.shifts.filter((s) => s.employeeId === emp.id && s.date === today).sort((a, b) => a.start.localeCompare(b.start))[0];
  const [loc, setLoc] = useState(shift && shift.location ? shift.location : "");
  const [busy, setBusy] = useState(false);
  const go = async (path, body) => { setBusy(true); try { await empAct(emp.id, path, body); } finally { setBusy(false); } };
  const openBreak = running && (running.breaks || []).find((b) => b.end === null);
  const needsBreakHint = running && !paused && entryNetMs(running) > 6 * 3600000 && entryBreakMs(running) < 30 * 60000;

  const status = !running
    ? { text: "Nicht eingestempelt", color: COLORS.textDim }
    : paused
      ? { text: `Pause seit ${fmtClock(openBreak.start)}`, color: COLORS.warn }
      : { text: `Arbeitet seit ${fmtClock(running.start)}`, color: COLORS.accent2 };

  return (
    <Panel style={isMe ? { borderColor: COLORS.accent2 } : {}}>
      <div className="flex items-start justify-between mb-1 gap-2">
        <div>
          <h3 className="font-medium">{emp.name}</h3>
          <p className="text-xs flex items-center gap-1.5" style={{ color: status.color }}>
            {running && <span className={`inline-block w-2 h-2 rounded-full ${paused ? "" : "pulse"}`} style={{ background: status.color }} />}
            {status.text}
          </p>
        </div>
        <div className="text-right">
          <div className="text-lg font-semibold tabular-nums">{fmtDuration(net)}</div>
          <div className="text-[11px]" style={{ color: COLORS.textDim }}>netto heute{brk > 0 && ` · Pause ${Math.round(brk / 60000)} Min`}</div>
        </div>
      </div>
      {shift && (
        <p className="text-xs mb-2 flex items-center gap-1.5 flex-wrap" style={{ color: COLORS.textDim }}>📅 Schicht {shift.start}–{shift.end} <LocTag loc={shift.location} /></p>
      )}
      {running && running.location && <p className="text-xs mb-2 flex items-center gap-1.5" style={{ color: COLORS.textDim }}>📍 Eingestempelt bei <LocTag loc={running.location} /></p>}
      {needsBreakHint && <p className="text-xs mb-2" style={{ color: COLORS.warn }}>Über 6 h ohne 30 Min Pause – bitte Pause machen.</p>}

      {!running ? (
        <div className="flex gap-2 mt-2">
          <Select value={loc} onChange={setLoc} className="flex-1 text-sm">
            <option value="">Standort…</option>
            {S.locations.map((l) => <option key={l} value={l}>{l}</option>)}
          </Select>
          <Btn kind="go" disabled={busy} onClick={() => go("/time/clockin", { location: loc || null })} className="px-5">▶ Start</Btn>
        </div>
      ) : (
        <div className="flex gap-2 mt-2">
          <Btn kind={paused ? "go" : "warn"} disabled={busy} onClick={() => go("/time/pause")} className="flex-1">{paused ? "▶ Weiter" : "⏸ Pause"}</Btn>
          <Btn kind="danger" disabled={busy} onClick={() => go("/time/clockout")} className="flex-1">■ Ende</Btn>
        </div>
      )}

      {todays.length > 0 && (
        <div className="space-y-1 mt-3 max-h-32 overflow-y-auto scrollbar-thin">
          {todays.map((e) => (
            <div key={e.id} className="flex items-center justify-between text-xs px-2.5 py-1.5 rounded-lg" style={{ background: COLORS.bg }}>
              <span style={{ color: COLORS.textDim }}>{fmtClock(e.start)} – {e.end ? fmtClock(e.end) : "läuft"}{entryBreakMs(e) > 0 && ` · ${Math.round(entryBreakMs(e) / 60000)}′ Pause`}</span>
              <span className="tabular-nums">{fmtDuration(entryNetMs(e))}</span>
            </div>
          ))}
        </div>
      )}
    </Panel>
  );
}

function SchichtTab({ S, me, isAdmin, act, activeEmployees }) {
  const [monday, setMonday] = useState(mondayOf(todayISO()));
  const [onlyMine, setOnlyMine] = useState(false);
  const [edit, setEdit] = useState(null); // {shift} oder {date}
  const days = weekDays(monday);
  const today = todayISO();
  const empName = (id) => (S.employees.find((e) => e.id === id) || {}).name || "?";
  const weekShifts = S.shifts.filter((s) => days.includes(s.date) && (!onlyMine || s.employeeId === me));

  async function copyWeek() {
    if (!confirm("Alle Schichten dieser Woche in die nächste Woche kopieren?")) return;
    const r = await act("/shifts/copy-week", { method: "POST", body: { from: monday, to: addDays(monday, 7) } });
    setMonday(addDays(monday, 7));
    alert(`${r.created} Schichten kopiert.`);
  }

  const totals = activeEmployees.map((e) => ({ e, ms: S.shifts.filter((s) => s.employeeId === e.id && days.includes(s.date)).reduce((a, s) => a + shiftMs(s), 0) })).filter((x) => x.ms > 0);

  return (
    <div>
      <div className="flex items-center justify-between gap-2 mb-4 flex-wrap">
        <WeekNav monday={monday} setMonday={setMonday} />
        <div className="flex gap-2">
          {me && <Btn kind="ghost" onClick={() => setOnlyMine(!onlyMine)} className="text-xs">{onlyMine ? "Alle zeigen" : "Nur meine"}</Btn>}
          {isAdmin && <Btn kind="ghost" onClick={copyWeek} className="text-xs">⧉ Woche kopieren</Btn>}
        </div>
      </div>

      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
        {days.map((d) => {
          const list = weekShifts.filter((s) => s.date === d).sort((a, b) => a.start.localeCompare(b.start));
          return (
            <Panel key={d} className="p-3" style={d === today ? { borderColor: COLORS.accent } : {}}>
              <div className="flex items-center justify-between mb-2">
                <h4 className="text-sm font-medium" style={{ color: d === today ? COLORS.accent : COLORS.text }}>{fmtDateShort(d)}</h4>
                {isAdmin && <button onClick={() => setEdit({ date: d })} className="w-7 h-7 rounded-md text-sm" style={{ border: `1px dashed ${COLORS.panelBorder}`, color: COLORS.textDim }}>+</button>}
              </div>
              <div className="space-y-1.5">
                {list.length === 0 && <p className="text-xs" style={{ color: COLORS.textDim }}>–</p>}
                {list.map((s) => (
                  <button key={s.id} onClick={() => isAdmin && setEdit({ shift: s })} className="w-full text-left px-2.5 py-1.5 rounded-lg text-xs"
                    style={{ background: COLORS.bg, borderLeft: `3px solid ${locColor(s.location)}`, cursor: isAdmin ? "pointer" : "default", outline: s.employeeId === me ? `1px solid ${COLORS.accent2}` : "none" }}>
                    <div className="flex justify-between gap-2"><span className="font-medium" style={{ color: COLORS.text }}>{empName(s.employeeId)}</span><span className="tabular-nums">{s.start}–{s.end}</span></div>
                    {(s.location || s.note) && <div className="mt-0.5" style={{ color: COLORS.textDim }}>{s.location}{s.location && s.note ? " · " : ""}{s.note}</div>}
                  </button>
                ))}
              </div>
            </Panel>
          );
        })}
      </div>

      {totals.length > 0 && (
        <Panel className="mt-4">
          <h4 className="text-sm font-medium mb-2">Geplante Stunden diese Woche</h4>
          <div className="flex flex-wrap gap-2">
            {totals.map(({ e, ms }) => (
              <span key={e.id} className="text-xs px-2.5 py-1 rounded-full" style={{ background: COLORS.bg }}>
                {e.name}: <b>{fmtHours(ms)} h</b>{e.weeklyHours ? <span style={{ color: COLORS.textDim }}> / {e.weeklyHours}</span> : null}
              </span>
            ))}
          </div>
        </Panel>
      )}

      {edit && <ShiftModal S={S} act={act} init={edit} onClose={() => setEdit(null)} activeEmployees={activeEmployees} />}
    </div>
  );
}

function ShiftModal({ S, act, init, onClose, activeEmployees }) {
  const s = init.shift;
  const [f, setF] = useState({
    employeeId: s ? s.employeeId : (activeEmployees[0] || {}).id || "",
    date: s ? s.date : init.date, start: s ? s.start : "09:00", end: s ? s.end : "17:00",
    location: s ? s.location || "" : "", note: s ? s.note || "" : "",
  });
  const set = (k) => (v) => setF((p) => ({ ...p, [k]: v && v.target ? v.target.value : v }));
  async function save() {
    try {
      await act(s ? "/shifts/" + s.id : "/shifts", { method: s ? "PATCH" : "POST", body: { ...f, location: f.location || null } });
      onClose();
    } catch (e) {}
  }
  async function del() {
    if (!confirm("Schicht löschen?")) return;
    try { await act("/shifts/" + s.id, { method: "DELETE" }); onClose(); } catch (e) {}
  }
  return (
    <Modal onClose={onClose}>
      <h3 className="text-sm font-medium mb-3">{s ? "Schicht bearbeiten" : "Neue Schicht"}</h3>
      <Field label="Mitarbeiter">
        <Select value={f.employeeId} onChange={set("employeeId")}>
          {activeEmployees.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
        </Select>
      </Field>
      <Field label="Datum"><TextInput type="date" value={f.date} onChange={set("date")} /></Field>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Von"><TextInput type="time" value={f.start} onChange={set("start")} /></Field>
        <Field label="Bis"><TextInput type="time" value={f.end} onChange={set("end")} /></Field>
      </div>
      <Field label="Standort">
        <Select value={f.location} onChange={set("location")}>
          <option value="">–</option>
          {S.locations.map((l) => <option key={l} value={l}>{l}</option>)}
        </Select>
      </Field>
      <Field label="Notiz"><TextInput value={f.note} onChange={set("note")} placeholder="optional" /></Field>
      <div className="flex gap-2">
        <Btn onClick={save} className="flex-1">Speichern</Btn>
        {s && <Btn kind="ghost" onClick={del} className="text-red-400">🗑</Btn>}
        <Btn kind="ghost" onClick={onClose}>Abbrechen</Btn>
      </div>
    </Modal>
  );
}

  const [locFilter, setLocFilter] = useState("");
  const [onlyMine, setOnlyMine] = useState(false);
  const [showDone, setShowDone] = useState(false);
  const today = todayISO();
  const empName = (id) => (S.employees.find((e) => e.id === id) || {}).name;
  const weekAgo = Date.now() - 7 * 864e5;
  const tasks = S.tasks.filter((t) => (!locFilter || t.location === locFilter) && (!onlyMine || t.employeeId === me));
  const prioRank = { hoch: 0, normal: 1, niedrig: 2 };
  const sortTasks = (a, b) => (prioRank[a.priority] ?? 1) - (prioRank[b.priority] ?? 1) || (a.due || "9999").localeCompare(b.due || "9999");

  async function move(t, dir) {
    const i = WORKFLOW_COLS.findIndex((c) => c.id === t.status);
    const next = WORKFLOW_COLS[i + dir];
    if (next) await act("/tasks/" + t.id, { method: "PATCH", body: { status: next.id } }).catch(() => {});
  }

  return (
    <div>
      <div className="flex gap-2 mb-4 flex-wrap items-center">
        <Btn onClick={() => setEdit({})}>+ Neue Aufgabe</Btn>
        <div className="w-44"><Select value={locFilter} onChange={setLocFilter} className="text-sm"><option value="">Alle Standorte</option>{S.locations.map((l) => <option key={l} value={l}>{l}</option>)}</Select></div>
        {me && <Btn kind="ghost" onClick={() => setOnlyMine(!onlyMine)} className="text-xs">{onlyMine ? "Alle" : "Nur meine"}</Btn>}
      </div>
      <div className="grid sm:grid-cols-3 gap-3">
        {WORKFLOW_COLS.map((col) => {
          let colTasks = tasks.filter((t) => t.status === col.id).sort(sortTasks);
          let hidden = 0;
          if (col.id === "fertig" && !showDone) {
            const recent = colTasks.filter((t) => (t.doneAt || t.createdAt || 0) >= weekAgo);
            hidden = colTasks.length - recent.length; colTasks = recent;
          }
          return (
            <div key={col.id} className="rounded-xl p-3" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
              <div className="flex items-center justify-between mb-3">
                <h4 className="text-sm font-medium">{col.label}</h4>
                <span className="text-xs px-1.5 py-0.5 rounded-full" style={{ background: COLORS.bg, color: COLORS.textDim }}>{colTasks.length}</span>
              </div>
              <div className="space-y-2 min-h-[48px]">
                {colTasks.map((t) => {
                  const overdue = t.due && t.due < today && t.status !== "fertig";
                  return (
                    <div key={t.id} className="p-2.5 rounded-lg" style={{ background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}`, borderLeft: `3px solid ${(PRIO[t.priority] || PRIO.normal).color}` }}>
                      <button onClick={() => setEdit({ task: t })} className="text-left w-full">
                        <p className="text-sm" style={{ textDecoration: t.status === "fertig" ? "line-through" : "none", color: t.status === "fertig" ? COLORS.textDim : COLORS.text }}>{t.title}</p>
                        {t.description && <p className="text-xs mt-0.5 line-clamp-2" style={{ color: COLORS.textDim }}>{t.description}</p>}
                      </button>
                      <div className="flex items-center justify-between mt-1.5 gap-2">
                        <div className="flex items-center gap-1.5 flex-wrap text-[11px]" style={{ color: COLORS.textDim }}>
                          <span>{empName(t.employeeId) ? `👤 ${empName(t.employeeId)}` : "Offen für alle"}</span>
                          {t.due && <span style={{ color: overdue ? COLORS.danger : COLORS.textDim }}>📅 {fmtDateShort(t.due)}</span>}
                          <LocTag loc={t.location} />
                        </div>
                        <div className="flex items-center gap-1 flex-shrink-0">
                          {col.id !== "offen" && <button onClick={() => move(t, -1)} className="w-7 h-7 rounded-md" style={{ color: COLORS.textDim, border: `1px solid ${COLORS.panelBorder}` }} title="Zurück">‹</button>}
                          {col.id !== "fertig" && <button onClick={() => move(t, 1)} className="w-7 h-7 rounded-md" style={{ color: COLORS.accent2, border: `1px solid ${COLORS.accent2}` }} title="Weiter">›</button>}
                        </div>
                      </div>
                    </div>
                  );
                })}
                {hidden > 0 && <button onClick={() => setShowDone(true)} className="text-xs underline" style={{ color: COLORS.textDim }}>+ {hidden} ältere anzeigen</button>}
              </div>
            </div>
          );
        })}
      </div>
      {edit && <TaskModal S={S} act={act} isAdmin={isAdmin} me={me} task={edit.task} onClose={() => setEdit(null)} />}
    </div>
  );
}

function TaskModal({ S, act, isAdmin, me, task, onClose }) {
  const [f, setF] = useState({
    title: task ? task.title : "", description: task ? task.description || "" : "",
    employeeId: task ? task.employeeId || "" : "", location: task ? task.location || "" : "",
    due: task ? task.due || "" : "", priority: task ? task.priority || "normal" : "normal",
    status: task ? task.status : "offen",
  });
  const set = (k) => (v) => setF((p) => ({ ...p, [k]: v && v.target ? v.target.value : v }));
  async function save() {
    if (!f.title.trim()) return;
    const body = { ...f, employeeId: f.employeeId || null, location: f.location || null, due: f.due || null };
    try { await act(task ? "/tasks/" + task.id : "/tasks", { method: task ? "PATCH" : "POST", body }); onClose(); } catch (e) {}
  }
  async function del() {
    if (!confirm("Aufgabe löschen?")) return;
    try { await act("/tasks/" + task.id, { method: "DELETE" }); onClose(); } catch (e) {}
  }
  return (
    <Modal onClose={onClose} wide>
      <h3 className="text-sm font-medium mb-3">{task ? "Aufgabe" : "Neue Aufgabe"}</h3>
      <Field label="Titel"><TextInput value={f.title} onChange={set("title")} autoFocus={!task} placeholder="z. B. Akkus E-Bikes laden" /></Field>
      <Field label="Beschreibung">
        <textarea value={f.description} onChange={set("description")} rows={3} className="w-full px-3 py-2 rounded-lg" style={inputStyle} placeholder="optional" />
      </Field>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Zuständig">
          <Select value={f.employeeId} onChange={set("employeeId")}>
            <option value="">Offen für alle</option>
            {S.employees.filter((e) => e.active).map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
          </Select>
        </Field>
        <Field label="Standort">
          <Select value={f.location} onChange={set("location")}><option value="">–</option>{S.locations.map((l) => <option key={l} value={l}>{l}</option>)}</Select>
        </Field>
        <Field label="Fällig am"><TextInput type="date" value={f.due} onChange={set("due")} /></Field>
        <Field label="Priorität">
          <Select value={f.priority} onChange={set("priority")}>{Object.entries(PRIO).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</Select>
        </Field>
      </div>
      {task && (
        <Field label="Status">
          <Select value={f.status} onChange={set("status")}>{WORKFLOW_COLS.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}</Select>
        </Field>
      )}

        <Btn kind="ghost" onClick={onClose}>Abbrechen</Btn>

      {task && task.doneAt && <p className="text-[11px] mt-2" style={{ color: COLORS.textDim }}>Erledigt am {new Date(task.doneAt).toLocaleString("de-AT")}</p>}
    </Modal>
  );
}

function monthStats(S, emp, ym) {
  const entries = S.timeEntries.filter((e) => e.employeeId === emp.id && e.date.startsWith(ym));
  const byDay = {};
  entries.forEach((e) => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const net = entries.reduce((s, e) => s + entryNetMs(e), 0);
  const brk = entries.reduce((s, e) => s + entryBreakMs(e), 0);
  const planned = S.shifts.filter((s) => s.employeeId === emp.id && s.date.startsWith(ym)).reduce((a, s) => a + shiftMs(s), 0);
  const warnings = [];
  Object.entries(byDay).forEach(([d, list]) => {
    const n = list.reduce((s, e) => s + entryNetMs(e), 0);
    const b = list.reduce((s, e) => s + entryBreakMs(e), 0);
    if (n > 6 * 3600000 && b < 30 * 60000) warnings.push(`${fmtDateShort(d)}: >6 h ohne 30 Min Pause`);
    if (n > 10 * 3600000) warnings.push(`${fmtDateShort(d)}: über 10 h`);
  });
  entries.filter((e) => e.end === null && e.date < todayISO()).forEach((e) => warnings.push(`${fmtDateShort(e.date)}: nicht ausgestempelt`));
  return { entries, days: Object.keys(byDay).length, net, brk, planned, warnings };
}

function MonthView({ S }) {
  const [ym, setYm] = useState(todayISO().slice(0, 7));
  const emps = S.employees.filter((e) => e.active || S.timeEntries.some((t) => t.employeeId === e.id && t.date.startsWith(ym)));
  const rows = emps.map((e) => ({ e, ...monthStats(S, e, ym) }));
  const total = rows.reduce((s, r) => s + r.net, 0);

  function exportSummary() {
    const out = [["Mitarbeiter", "Monat", "Arbeitstage", "Netto (Std)", "Pausen (Std)", "Geplant (Std)", "Differenz (Std)", "Hinweise"]];
    rows.forEach((r) => out.push([r.e.name, ym, r.days, fmtHours(r.net), fmtHours(r.brk), fmtHours(r.planned), r.planned ? fmtHours(r.net - r.planned) : "", r.warnings.join(" | ")]));
    downloadCSV(`stunden_${ym}_zusammenfassung.csv`, out);
  }
  function exportDetail() {
    const out = [["Mitarbeiter", "Datum", "Wochentag", "Beginn", "Ende", "Pause (Min)", "Netto (Std)", "Standort", "Notiz", "Korrigiert von"]];
    S.timeEntries.filter((e) => e.date.startsWith(ym)).sort((a, b) => a.date.localeCompare(b.date) || a.start - b.start).forEach((e) => {
      const emp = S.employees.find((x) => x.id === e.employeeId);
      out.push([emp ? emp.name : "?", parseISO(e.date).toLocaleDateString("de-AT"), fmtDateShort(e.date).split(",")[0], fmtClock(e.start), e.end ? fmtClock(e.end) : "läuft", Math.round(entryBreakMs(e) / 60000), fmtHours(entryNetMs(e)), e.location || "", e.note || "", e.editedBy || ""]);
    });
    downloadCSV(`stunden_${ym}_details.csv`, out);
  }

  return (
    <div>
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <div className="w-44"><TextInput type="month" value={ym} onChange={(e) => e.target.value && setYm(e.target.value)} /></div>
        <Btn kind="ghost" onClick={exportSummary} className="text-xs">⬇ CSV Zusammenfassung</Btn>
        <Btn kind="ghost" onClick={exportDetail} className="text-xs">⬇ CSV Details</Btn>
      </div>
      <Panel className="p-0 overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-xs text-left" style={{ color: COLORS.textDim }}>
              <th className="p-3 font-medium">{fmtMonth(ym)}</th>
              <th className="p-3 font-medium text-right">Tage</th>
              <th className="p-3 font-medium text-right">Netto</th>
              <th className="p-3 font-medium text-right hidden sm:table-cell">Pause</th>
              <th className="p-3 font-medium text-right">Geplant</th>
              <th className="p-3 font-medium text-right">Diff.</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => {
              const diff = r.net - r.planned;
              return (
                <React.Fragment key={r.e.id}>
                  <tr style={{ borderTop: `1px solid ${COLORS.panelBorder}` }}>
                    <td className="p-3">{r.e.name}{r.warnings.length > 0 && <span title={r.warnings.join("\n")} style={{ color: COLORS.warn }}> ⚠</span>}</td>
                    <td className="p-3 text-right tabular-nums">{r.days}</td>
                    <td className="p-3 text-right tabular-nums font-medium">{fmtHours(r.net)}</td>
                    <td className="p-3 text-right tabular-nums hidden sm:table-cell" style={{ color: COLORS.textDim }}>{fmtHours(r.brk)}</td>
                    <td className="p-3 text-right tabular-nums" style={{ color: COLORS.textDim }}>{r.planned ? fmtHours(r.planned) : "–"}</td>
                    <td className="p-3 text-right tabular-nums" style={{ color: !r.planned ? COLORS.textDim : diff >= 0 ? COLORS.accent2 : COLORS.danger }}>{r.planned ? (diff >= 0 ? "+" : "") + fmtHours(diff) : "–"}</td>
                  </tr>
                  {r.warnings.length > 0 && (
                    <tr><td colSpan={6} className="px-3 pb-2 text-[11px]" style={{ color: COLORS.warn }}>{r.warnings.join(" · ")}</td></tr>
                  )}
                </React.Fragment>
              );
            })}
            <tr style={{ borderTop: `1px solid ${COLORS.panelBorder}` }}>
              <td className="p-3 font-medium">Gesamt</td><td></td>
              <td className="p-3 text-right tabular-nums font-semibold" style={{ color: COLORS.accent }}>{fmtHours(total)}</td>
              <td colSpan={3}></td>
            </tr>
          </tbody>
        </table>
      </Panel>
      <p className="text-[11px] mt-2" style={{ color: COLORS.textDim }}>Stunden als Dezimalzahl (7,50 = 7 h 30 min). CSV öffnet direkt in Excel.</p>
    </div>
  );
}

function EntryModal({ S, act, init, onClose }) {
  const e = init.entry;
  const [f, setF] = useState({
    date: e ? e.date : todayISO(),
    start: e ? hmOf(e.start) : "09:00",
    end: e && e.end ? hmOf(e.end) : e ? "" : "17:00",
    breakMin: e ? String(Math.round(entryBreakMs(e) / 60000)) : "30",
    location: e ? e.location || "" : "", note: e ? e.note || "" : "",
  });
  const [err, setErr] = useState("");
  const set = (k) => (v) => setF((p) => ({ ...p, [k]: v && v.target ? v.target.value : v }));
  const empName = (S.employees.find((x) => x.id === (e ? e.employeeId : init.employeeId)) || {}).name;

  async function save() {
    setErr("");
    const start = tsFrom(f.date, f.start);
    let end = f.end ? tsFrom(f.date, f.end) : null;
    if (end !== null && end <= start) end += 864e5; // über Mitternacht
    const body = { date: f.date, start, end, breakMin: f.breakMin === "" ? 0 : Number(f.breakMin), location: f.location || null, note: f.note };
    try {
      await api(e ? "/time/" + e.id : "/time", { method: e ? "PATCH" : "POST", token: store.get(TOKEN_KEY), body: e ? body : { ...body, employeeId: init.employeeId } });
      await act("/state").catch(() => {});
      onClose();
    } catch (x) { setErr(x.message); }
  }
  async function del() {
    if (!confirm("Eintrag löschen?")) return;
    try { await act("/time/" + e.id, { method: "DELETE" }); onClose(); } catch (x) {}
  }
  return (
    <Modal onClose={onClose}>
      <h3 className="text-sm font-medium mb-3">{e ? "Eintrag korrigieren" : "Eintrag nachtragen"} – {empName}</h3>
      <Field label="Datum"><TextInput type="date" value={f.date} onChange={set("date")} /></Field>
      <div className="grid grid-cols-3 gap-2">
        <Field label="Beginn"><TextInput type="time" value={f.start} onChange={set("start")} /></Field>
        <Field label="Ende"><TextInput type="time" value={f.end} onChange={set("end")} /></Field>
        <Field label="Pause (Min)"><TextInput type="number" min="0" inputMode="numeric" value={f.breakMin} onChange={set("breakMin")} /></Field>
      </div>
      <Field label="Standort"><Select value={f.location} onChange={set("location")}><option value="">–</option>{S.locations.map((l) => <option key={l} value={l}>{l}</option>)}</Select></Field>
      <Field label="Notiz / Grund"><TextInput value={f.note} onChange={set("note")} placeholder="z. B. vergessen auszustempeln" /></Field>
      {!f.end && <p className="text-xs mb-2" style={{ color: COLORS.textDim }}>Ende leer lassen = Eintrag läuft noch.</p>}
      {err && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{err}</p>}
      <div className="flex gap-2">
        <Btn onClick={save} className="flex-1">Speichern</Btn>
        {e && <Btn kind="ghost" onClick={del}>🗑</Btn>}
        <Btn kind="ghost" onClick={onClose}>Abbrechen</Btn>
      </div>
    </Modal>
  );
}

const CHAT_READ_KEY = "team-app-chat-read";
function chatUnread(S) {
  let last = 0;
  try { last = Number(localStorage.getItem(CHAT_READ_KEY) || 0); } catch (e) {}
  return (S.messages || []).filter((m) => m.at > last && m.authorId !== S.myAuthorId).length;
}

function ChatTab({ S, isAdmin, act, token }) {
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const listRef = useRef(null);
  const msgs = S.messages || [];
  const lastId = msgs.length ? msgs[msgs.length - 1].id : "";

  // Als gelesen markieren und nach unten scrollen, wenn neue Nachrichten kommen
  useEffect(() => {
    try { localStorage.setItem(CHAT_READ_KEY, String(Date.now())); } catch (e) {}
    const el = listRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [lastId]);

  async function send() {
    const t = text.trim();
    if (!t || sending) return;
    setSending(true);
    try { await act("/chat", { method: "POST", body: { text: t } }); setText(""); } catch (e) {}
    setSending(false);
  }
  async function del(m) {
    if (!confirm("Nachricht löschen?")) return;
    await act("/chat/" + m.id, { method: "DELETE" }).catch(() => {});
  }

  let lastDate = "";
  return (
    <>
    <PushBanner token={token} compact />
    <div className="flex flex-col rounded-xl overflow-hidden" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, height: "calc(100vh - 270px)", minHeight: 360 }}>
      <div className="px-4 py-2.5 text-sm font-medium flex items-center justify-between" style={{ borderBottom: `1px solid ${COLORS.panelBorder}` }}>
        <span>💬 Team-Chat</span>
        <span className="text-xs" style={{ color: COLORS.textDim }}>{S.employees.filter((e) => e.active).length} Mitarbeiter</span>
      </div>
      <div ref={listRef} className="flex-1 overflow-y-auto scrollbar-thin px-3 py-3 space-y-1.5">
        {msgs.length === 0 && <p className="text-sm text-center mt-8" style={{ color: COLORS.textDim }}>Noch keine Nachrichten. Schreib die erste! 👋</p>}
        {msgs.map((m, i) => {
          const mine = m.authorId === S.myAuthorId;
          const d = localISO(new Date(m.at));
          const showDate = d !== lastDate; lastDate = d;
          const prev = msgs[i - 1];
          const showName = !mine && (!prev || prev.authorId !== m.authorId || showDate);
          return (
            <React.Fragment key={m.id}>
              {showDate && (
                <div className="text-center my-2"><span className="text-[11px] px-2 py-0.5 rounded-full" style={{ background: COLORS.bg, color: COLORS.textDim }}>{d === todayISO() ? "Heute" : d === addDays(todayISO(), -1) ? "Gestern" : fmtDateShort(d)}</span></div>
              )}
              <div className={`flex ${mine ? "justify-end" : "justify-start"}`}>
                <div className="max-w-[80%] px-3 py-1.5 rounded-2xl" style={{ background: mine ? COLORS.accent2 + "33" : COLORS.bg, border: `1px solid ${mine ? COLORS.accent2 + "66" : COLORS.panelBorder}`, borderBottomRightRadius: mine ? 6 : undefined, borderBottomLeftRadius: mine ? undefined : 6 }}>
                  {showName && <div className="text-[11px] font-medium mb-0.5" style={{ color: m.isAdmin ? COLORS.accent : COLORS.accent2 }}>{m.authorName}{m.isAdmin ? " · Admin" : ""}</div>}
                  <div className="text-sm whitespace-pre-wrap break-words">{m.text}</div>
                  <div className="text-[10px] text-right mt-0.5 flex items-center justify-end gap-2" style={{ color: COLORS.textDim }}>
                    {(mine || isAdmin) && <button onClick={() => del(m)} title="Löschen" className="opacity-60 hover:opacity-100">🗑</button>}
                    {fmtClock(m.at)}
                  </div>
                </div>
              </div>
            </React.Fragment>
          );
        })}
      </div>
      <div className="flex gap-2 p-2" style={{ borderTop: `1px solid ${COLORS.panelBorder}` }}>
        <textarea value={text} onChange={(e) => setText(e.target.value)} rows={1} placeholder="Nachricht…"
          onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
          className="flex-1 px-3 py-2 rounded-lg resize-none" style={{ ...inputStyle, maxHeight: 120 }} />
        <Btn onClick={send} disabled={!text.trim() || sending} className="px-4">➤</Btn>
      </div>
    </div>
    </>
  );
}

// =====================================================================
// PUSH-BENACHRICHTIGUNGEN
// =====================================================================
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function b64ToBytes(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}
async function currentSub() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
// Abo anlegen (fragt ggf. nach Erlaubnis) und beim Server speichern
async function enablePush(token) {
  if (!pushSupported()) throw new Error("Dieses Gerät/dieser Browser unterstützt keine Benachrichtigungen.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Benachrichtigungen wurden nicht erlaubt.");
  const { publicKey } = await api("/push/key");
  if (!publicKey) throw new Error("Server unterstützt noch keine Benachrichtigungen.");
  const reg = await navigator.serviceWorker.register("/service-worker.js").then(() => navigator.serviceWorker.ready);
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
  await api("/push/subscribe", { method: "POST", token, body: { subscription: sub.toJSON() } });
  return true;
}
// Nach dem Login: vorhandenes Abo dem angemeldeten Benutzer zuordnen
async function syncPush(token) {
  try {
    if (!pushSupported() || Notification.permission !== "granted") return false;
    const sub = await currentSub();
    if (!sub) return false;
    await api("/push/subscribe", { method: "POST", token, body: { subscription: sub.toJSON() } });
    return true;
  } catch (e) { return false; }
}
async function unlinkPush() {
  try { const sub = await currentSub(); if (sub) await api("/push/unsubscribe", { method: "POST", body: { endpoint: sub.endpoint } }); } catch (e) {}
}

function PushBanner({ token, compact }) {
  const [state, setState] = useState("checking"); // checking | on | off | denied | ios | unsupported
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [hidden, setHidden] = useState(() => { try { return localStorage.getItem("team-app-push-hide") === "1"; } catch (e) { return false; } });
  useEffect(() => {
    (async () => {
      if (isIOS() && !isStandalone()) return setState("ios");
      if (!pushSupported()) return setState("unsupported");
      if (Notification.permission === "denied") return setState("denied");
      const sub = await currentSub().catch(() => null);
      setState(sub && Notification.permission === "granted" ? "on" : "off");
    })();
  }, []);
  async function turnOn() {
    setBusy(true); setMsg("");
    try { await enablePush(token); setState("on"); setMsg("Aktiviert ✓"); }
    catch (e) { setMsg(e.message); if (Notification.permission === "denied") setState("denied"); }
    setBusy(false);
  }
  async function test() {
    setMsg("");
    try { const r = await api("/push/test", { method: "POST", token }); setMsg(r.sent ? "Test gesendet – kommt gleich ✓" : "Kein Abo gefunden – bitte neu aktivieren."); if (!r.sent) setState("off"); }
    catch (e) { setMsg(e.message); }
  }
  if (state === "checking") return null;
  if (state === "on") {
    if (!compact) return null;
    return (
      <div className="flex items-center justify-between gap-2 mb-3 text-xs px-3 py-2 rounded-lg" style={{ background: COLORS.accent2 + "15", color: COLORS.accent2 }}>
        <span>🔔 Benachrichtigungen aktiv {msg && <span style={{ color: COLORS.textDim }}>· {msg}</span>}</span>
        <button onClick={test} className="underline">Test</button>
      </div>
    );
  }
  if (hidden && !compact) return null;
  const box = (children) => (
    <div className="mb-3 px-3 py-2.5 rounded-lg text-xs" style={{ background: COLORS.accent + "15", border: `1px solid ${COLORS.accent}55`, color: COLORS.text }}>
      {children}
      {msg && <p className="mt-1" style={{ color: COLORS.warn }}>{msg}</p>}
    </div>
  );
  if (state === "ios") return box(<><b>🔔 Benachrichtigungen am iPhone:</b> Öffne die App über das Teilen-Symbol <b>⎋ → „Zum Home-Bildschirm“</b> und starte sie dann vom Home-Bildschirm. Danach kannst du sie hier aktivieren.</>);
  if (state === "unsupported") return compact ? box(<>Dieser Browser unterstützt keine Benachrichtigungen. Tipp: Chrome (Android) oder die installierte App am iPhone verwenden.</>) : null;
  if (state === "denied") return box(<><b>🔕 Benachrichtigungen blockiert.</b> Erlaube sie in den Browser-/Handy-Einstellungen für diese Seite und lade die App neu.</>);
  return box(
    <div className="flex items-center justify-between gap-3">
      <span><b>🔔 Benachrichtigungen aktivieren</b><br /><span style={{ color: COLORS.textDim }}>Bei neuen Chat-Nachrichten, Schichten und Aufgaben.</span></span>
      <div className="flex items-center gap-2 flex-shrink-0">
        {!compact && <button onClick={() => { setHidden(true); try { localStorage.setItem("team-app-push-hide", "1"); } catch (e) {} }} style={{ color: COLORS.textDim }} title="Ausblenden">✕</button>}
        <Btn onClick={turnOn} disabled={busy} className="text-xs py-1.5">Aktivieren</Btn>
      </div>
    </div>
  );
}
