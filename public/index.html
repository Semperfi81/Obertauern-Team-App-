<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Crew Sport Gefäll – Team-App</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#15171C" />
<link rel="icon" type="image/png" href="/icon-192.png?v=2" />
<link rel="apple-touch-icon" href="/icon-192.png?v=2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Team-App" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<script src="/i18n.js"></script>
<style>
  html, body { margin:0; padding:0; background:#15171C; }
  * { box-sizing: border-box; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #2A2E38; border-radius: 4px; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #E8A33D; outline-offset: 2px; }
  input, select, textarea { font-size: 16px; } /* verhindert Zoom auf iPhone */
  @media (min-width: 640px) { input, select, textarea { font-size: 14px; } }
  input[type="date"], input[type="time"], input[type="month"] { color-scheme: dark; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  #boot-error { display:none; color:#ff8a70; background:#1a1a1a; padding:16px; font-family:monospace; font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-error"></div>
<script>
  // Zeigt Fehler nur an, wenn die App gar nicht startet
  window.addEventListener("error", function (ev) {
    if (document.getElementById("root").children.length) return;
    var box = document.getElementById("boot-error");
    box.style.display = "block";
    box.textContent = "App konnte nicht starten: " + ev.message + "\nBitte Seite neu laden.";
  });
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

const TOKEN_KEY = "team-app-token";
const LAST_EMP_KEY = "team-app-last-employee";

const COLORS = {
  bg: "#15171C", panel: "#1C1F26", panelBorder: "#2A2E38",
  accent: "#E8A33D", accent2: "#4DA8A0", text: "#E9EAEC",
  textDim: "#8C919E", danger: "#D5694B", warn: "#E0B341",
};
// Farben für Standorte/Bereiche – feste Farbe pro Name, damit sie überall gleich aussieht
const LOC_PALETTE = ["#4DA8A0", "#E8A33D", "#6FA8DC", "#D5694B", "#7FB069", "#B48EDB", "#E07A9B", "#C9B458"];
const LOC_FIXED = { "Allgemein": "#8C919E", "Haupt": "#4DA8A0", "Grünwaldkopf": "#6FA8DC", "Skiverleih": "#6FA8DC", "Alpine Mini Market": "#E8A33D" };
function locColor(l) {
  if (!l) return COLORS.textDim;
  if (LOC_FIXED[l]) return LOC_FIXED[l];
  let h = 0; for (const c of l) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return LOC_PALETTE[h % LOC_PALETTE.length];
}

// ---------- Datum & Zeit (immer lokale Zeit, nicht UTC) ----------
const pad = (n) => String(n).padStart(2, "0");
const localISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => localISO(new Date());
const parseISO = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return localISO(d); }
function mondayOf(iso) { const d = parseISO(iso); const day = d.getDay(); return addDays(iso, day === 0 ? -6 : 1 - day); }
function weekDays(iso) { const m = mondayOf(iso); return [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(m, i)); }
function monthDays(ym) {
  const [y, m] = ym.split("-").map(Number);
  const n = new Date(y, m, 0).getDate();
  return Array.from({ length: n }, (_, i) => `${ym}-${pad(i + 1)}`);
}
const tsFrom = (date, hm) => new Date(`${date}T${hm}:00`).getTime();
const hmOf = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const minutesOf = (hm) => { const [h, m] = hm.split(":").map(Number); return h * 60 + m; };

function fmtDuration(ms) {
  const totalMin = Math.max(0, Math.floor(ms / 60000));
  return `${Math.floor(totalMin / 60)}h ${pad(totalMin % 60)}m`;
}
const fmtHours = (ms) => (ms / 3600000).toFixed(2).replace(".", ",");
const fmtClock = (ts) => hmOf(ts);
function fmtDateShort(iso) {
  return parseISO(iso).toLocaleDateString(window.I18N.locale, { weekday: "short", day: "2-digit", month: "2-digit" });
}
function fmtDateLong(iso) {
  return parseISO(iso).toLocaleDateString(window.I18N.locale, { weekday: "long", day: "numeric", month: "long" });
}
function fmtMonth(ym) {
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString(window.I18N.locale, { month: "long", year: "numeric" });
}

// ---------- Berechnungen ----------
function entryBreakMs(e, now = Date.now()) {
  if (e.manualBreakMin !== null && e.manualBreakMin !== undefined) return e.manualBreakMin * 60000;
  return (e.breaks || []).reduce((s, b) => s + ((b.end || now) - b.start), 0);
}
const entryGrossMs = (e, now = Date.now()) => (e.end || now) - e.start;
const entryNetMs = (e, now = Date.now()) => Math.max(0, entryGrossMs(e, now) - entryBreakMs(e, now));
// Tageswerte inkl. automatischer Mittagspause (gestempelte Pausen werden angerechnet)
function dayStats(S, personId, date, now = Date.now()) {
  const list = S.timeEntries.filter((e) => e.employeeId === personId && e.date === date);
  const gross = list.reduce((s, e) => s + entryGrossMs(e, now), 0);
  const brk = list.reduce((s, e) => s + entryBreakMs(e, now), 0);
  const worked = Math.max(0, gross - brk);
  const L = S.lunch || {};
  let lunch = 0;
  // keine automatische Mittagspause bei Admin-Zeiten
  if (L.enabled && !String(personId).startsWith("admin:") && worked > (L.minHours || 0) * 3600000) lunch = Math.min(Math.max(0, (L.minutes || 0) * 60000 - brk), worked);
  return { list, gross, brk, lunch, net: Math.max(0, worked - lunch) };
}
function rangeStats(S, personId, dates) {
  const r = { net: 0, brk: 0, lunch: 0, days: 0 };
  [...new Set(dates)].forEach((d) => { const x = dayStats(S, personId, d); if (x.list.length) r.days++; r.net += x.net; r.brk += x.brk; r.lunch += x.lunch; });
  return r;
}
const onBreak = (e) => !!e && e.end === null && (e.breaks || []).some((b) => b.end === null);
// Geplante Stunden einer Schicht – automatische Mittagspause wird wie bei der Zeiterfassung abgezogen
let LUNCH_CFG = null;
const shiftMs = (s) => {
  let d = minutesOf(s.end) - minutesOf(s.start); if (d < 0) d += 1440;
  const L = LUNCH_CFG;
  if (L && L.enabled && d >= (Number(L.minHours) || 0) * 60) d = Math.max(0, d - (Number(L.minutes) || 0));
  return d * 60000;
};

// ---------- CSV (Excel-freundlich: Semikolon, BOM für Umlaute) ----------
function downloadCSV(filename, rows) {
  const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------- API ----------
async function api(path, { method = "GET", body, token } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch("/api" + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || "Fehler bei der Anfrage."); err.data = data; throw err; }
  return data;
}
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};

// ---------- Personen (Mitarbeiter + Admins für Admin-Zeiterfassung) ----------
function adminPersons(S) { return (S.admins || []).map((a) => ({ ...a, active: true, isAdminPerson: true })); }
function personName(S, id) {
  const p = (S.employees || []).find((e) => e.id === id) || (S.admins || []).find((a) => a.id === id);
  if (p) return p.name + (String(id).startsWith("admin:") ? " (Admin)" : "");
  return String(id).startsWith("admin:") ? "Admin (gelöscht)" : "?";
}

// ---------- UI-Bausteine ----------
const inputStyle = { background: COLORS.bg, border: `1px solid ${COLORS.panelBorder}`, color: COLORS.text };

function Panel({ children, className = "", style = {}, onClick }) {
  return (
    <div onClick={onClick} className={`rounded-xl p-4 ${className}`} style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, ...style }}>
      {children}
    </div>
  );
}
function Modal({ children, onClose, wide }) {
  useEffect(() => {
    const h = (e) => e.key === "Escape" && onClose && onClose();
    window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h);
  }, [onClose]);
  return (
    <div className="fixed inset-0 flex items-end sm:items-center justify-center z-50 sm:px-4" style={{ background: "rgba(0,0,0,0.65)" }}
      onMouseDown={(e) => e.target === e.currentTarget && onClose && onClose()}>
      <div className={`w-full ${wide ? "sm:max-w-lg" : "sm:max-w-sm"} max-h-[92vh] overflow-y-auto scrollbar-thin rounded-t-2xl sm:rounded-xl p-4`}
        style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
        {children}
      </div>
    </div>
  );
}
function Btn({ children, onClick, kind = "primary", className = "", disabled, title, type = "button" }) {
  const styles = {
    primary: { background: COLORS.accent, color: "#1A1A1A" },
    go: { background: COLORS.accent2, color: "#0E1411" },
    danger: { background: COLORS.danger, color: "#fff" },
    ghost: { border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textDim, background: "transparent" },
    warn: { background: COLORS.warn + "22", border: `1px solid ${COLORS.warn}`, color: COLORS.warn },
  };
  return (
    <button type={type} title={title} disabled={disabled} onClick={onClick}
      className={`flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium disabled:opacity-40 ${className}`} style={styles[kind]}>
      {children}
    </button>
  );
}
function Field({ label, children, className = "" }) {
  return (
    <label className={`block mb-3 ${className}`}>
      <span className="block text-xs mb-1" style={{ color: COLORS.textDim }}>{label}</span>
      {children}
    </label>
  );
}
function TextInput(props) {
  return <input {...props} className={`w-full px-3 py-2 rounded-lg ${props.className || ""}`} style={props.disabled ? { ...inputStyle, opacity: 0.6 } : inputStyle} />;
}
function Select({ value, onChange, children, className = "", disabled }) {
  return <select value={value} disabled={disabled} onChange={(e) => onChange(e.target.value)} className={`w-full px-3 py-2 rounded-lg ${className}`} style={disabled ? { ...inputStyle, opacity: 0.6 } : inputStyle}>{children}</select>;
}
function Segmented({ value, onChange, options }) {
  return (
    <div className="flex gap-1 p-1 rounded-lg" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
      {options.map((o) => (
        <button key={o.id} onClick={() => onChange(o.id)} className="px-3 py-1.5 rounded-md text-xs font-medium whitespace-nowrap"
          style={{ background: value === o.id ? COLORS.accent : "transparent", color: value === o.id ? "#1A1A1A" : COLORS.textDim }}>
          {o.label}
        </button>
      ))}
    </div>
  );
}
function LocTag({ loc }) {
  if (!loc) return null;
  return <span className="text-[11px] px-1.5 py-0.5 rounded" style={{ background: locColor(loc) + "22", color: locColor(loc) }}>{loc}</span>;
}
function Empty({ children }) {
  return <p className="text-sm py-2" style={{ color: COLORS.textDim }}>{children}</p>;
}
function WeekNav({ monday, setMonday }) {
  const days = weekDays(monday);
  return (
    <div className="flex items-center gap-2">
      <button onClick={() => setMonday(addDays(monday, -7))} className="w-9 h-9 rounded-lg" style={{ border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textDim }}>‹</button>
      <div className="text-sm text-center min-w-[150px]">{fmtDateShort(days[0]).slice(4)} – {fmtDateShort(days[6]).slice(4)}</div>
      <button onClick={() => setMonday(addDays(monday, 7))} className="w-9 h-9 rounded-lg" style={{ border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textDim }}>›</button>
      {monday !== mondayOf(todayISO()) && <button onClick={() => setMonday(mondayOf(todayISO()))} className="text-xs underline" style={{ color: COLORS.accent }}>Heute</button>}
    </div>
  );
}

// ---------- Tabs ----------
const TABS = [
  { id: "zeit", label: "Zeit", icon: "🕒" },
  { id: "schichten", label: "Dienstplan", icon: "📅" },
  { id: "aufgaben", label: "Aufgaben", icon: "📋" },
  { id: "checklisten", label: "Listen", icon: "☑️" },
  { id: "chat", label: "Chat", icon: "💬" },
];
const ADMIN_TAB = { id: "admin", label: "Auswertung", icon: "📊" };

function App() {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [offline, setOffline] = useState(false);
  const [tab, setTab] = useState(() => {
    const t = new URLSearchParams(location.search).get("tab");
    return ["zeit", "schichten", "aufgaben", "checklisten", "chat", "admin"].includes(t) ? t : "zeit";
  });
  const [S, setS] = useState({ role: null, employees: [], timeEntries: [], todos: [], tasks: [], shifts: [], checklistTemplates: [], checklistRuns: [], locations: [], loginEmployees: [] });
  const [token, setTokenState] = useState(() => store.get(TOKEN_KEY));
  const setToken = (t) => { setTokenState(t); store.set(TOKEN_KEY, t); };
  const [authView, setAuthView] = useState(null);

  LUNCH_CFG = S.lunch || null;
  const role = S.role;
  const isAdmin = role === "admin";
  const me = S.me ? S.me.id : null;

  const refresh = useCallback(async () => {
    try {
      const d = await api("/state", { token });
      setS((prev) => ({ ...prev, ...d }));
      setOffline(false);
      if (!d.role && token) setToken(null); // Anmeldung abgelaufen / PIN geändert
    } catch (e) {
      setOffline(true);
    }
    setLoading(false);
  }, [token]);

  useEffect(() => { refresh(); }, [refresh]);
  useEffect(() => {
    const id = setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 5000);
    const onVis = () => document.visibilityState === "visible" && refresh();
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [refresh]);

  const activeEmployees = (S.employees || []).filter((e) => e.active);

  // Tippen auf eine Benachrichtigung bei offener App -> passenden Tab öffnen
  useEffect(() => {
    if (!("serviceWorker" in navigator)) return;
    const h = (ev) => {
      if (ev.data && ev.data.type === "open") {
        const t = new URL(ev.data.url, location.origin).searchParams.get("tab");
        if (t) setTab(t);
        refresh();
      }
    };
    navigator.serviceWorker.addEventListener("message", h);
    return () => navigator.serviceWorker.removeEventListener("message", h);
  }, [refresh]);
  // Nach Anmeldung vorhandenes Push-Abo dem Benutzer zuordnen
  useEffect(() => { if (role && token) syncPush(token); }, [role, token]);

  // Führt eine Änderung aus und lädt danach neu
  const act = useCallback(async (path, opts = {}) => {
    try {
      const r = await api(path, { token, ...opts });
      await refresh();
      return r;
    } catch (e) {
      if (e.data && e.data.needLogin) { setToken(null); }
      setError(e.message); throw e;
    }
  }, [token, refresh]);
  // Stempeln: Mitarbeiter immer für sich selbst, Admin für die gewählte Person
  const empAct = useCallback((employeeId, path, body = {}) => act(path, { method: "POST", body: { employeeId, ...body } }).catch(() => {}), [act]);

  function loginDone(res) {
    setToken(res.token);
    setAuthView(null); setTab("zeit"); setError("");
  }
  async function logout() {
    if (!confirm("Abmelden?")) return;
    await unlinkPush();
    if (role === "employee") await api("/logout", { method: "POST", token }).catch(() => {});
    setToken(null);
    setS((p) => ({ ...p, role: null, me: null, timeEntries: [], employees: [] }));
    setTab("zeit");
  }

  if (loading) {
    return (
      <div style={{ background: COLORS.bg }} className="min-h-screen flex items-center justify-center">
        <div className="spin" style={{ width: 28, height: 28, border: `3px solid ${COLORS.panelBorder}`, borderTopColor: COLORS.accent, borderRadius: "50%" }} />
      </div>
    );
  }

  if (!role) {
    return (
      <>
        <LoginScreen S={S} offline={offline} onDone={loginDone} openAdmin={() => setAuthView(S.adminCount === 0 ? "setup" : "login")} />
        {(authView === "setup" || authView === "login") && <AuthModal mode={authView} onDone={loginDone} onClose={() => setAuthView(null)} />}
      </>
    );
  }

  const tabs = isAdmin ? [...TABS, ADMIN_TAB] : TABS;
  const ctx = { S, me, isAdmin, token, act, empAct, setError, activeEmployees, openAdmins: () => setAuthView("manage") };
  const displayName = isAdmin ? S.adminName : (S.me || {}).name;
  const unread = chatUnread(S);

  return (
    <div style={{ background: COLORS.bg, color: COLORS.text, minHeight: "100vh" }} className="font-sans">
      <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-4 pb-24 sm:pb-8">
        <header className="flex items-center justify-between gap-3 mb-4">
          <div className="flex items-center gap-3 min-w-0">
            <img src="/icon-192.png?v=2" alt="" className="w-11 h-11 rounded-full flex-shrink-0" />
            <div className="min-w-0">
              <h1 className="text-base sm:text-lg font-semibold tracking-tight truncate">Crew Sport Gefäll</h1>
              <p className="text-xs truncate" style={{ color: COLORS.textDim }}>{fmtDateLong(todayISO())}</p>
            </div>
          </div>
          <div className="flex items-center gap-1.5 flex-shrink-0">
            <LangPicker compact />
            {!isAdmin && (
              <button onClick={() => setAuthView("pin")} title="PIN ändern" className="px-2.5 py-1.5 rounded-full text-xs" style={{ border: `1px solid ${COLORS.panelBorder}`, color: COLORS.textDim }}>🔑</button>
            )}
            <button onClick={logout} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium"
              style={{ background: (isAdmin ? COLORS.accent : COLORS.accent2) + "22", border: `1px solid ${isAdmin ? COLORS.accent : COLORS.accent2}`, color: isAdmin ? COLORS.accent : COLORS.accent2 }}>
              {isAdmin ? "🔓" : "👤"} {displayName}<span className="hidden sm:inline"> · Abmelden</span>
            </button>
          </div>
        </header>

        {offline && (
          <div className="mb-3 px-3 py-2 rounded-lg text-xs" style={{ background: COLORS.warn + "22", border: `1px solid ${COLORS.warn}`, color: COLORS.warn }}>
            Keine Verbindung zum Server – Anzeige ist evtl. nicht aktuell.
          </div>
        )}
        {error && (
          <div className="mb-3 px-3 py-2 rounded-lg text-xs flex justify-between gap-2" style={{ background: COLORS.danger + "22", border: `1px solid ${COLORS.danger}`, color: COLORS.danger }}>
            <span>{error}</span><button onClick={() => setError("")} className="underline">schließen</button>
          </div>
        )}
        {isAdmin && activeEmployees.length === 0 && (
          <div className="mb-4 px-3 py-2 rounded-lg text-xs" style={{ background: COLORS.accent + "18", border: `1px solid ${COLORS.accent}`, color: COLORS.accent }}>
            Noch keine Mitarbeiter – unter 📊 Auswertung → Team anlegen (mit PIN).
          </div>
        )}

        <nav className="hidden sm:flex gap-1 mb-5 p-1 rounded-xl" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
          {tabs.map(({ id, label, icon }) => (
            <button key={id} onClick={() => setTab(id)} className="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-sm font-medium"
              style={{ background: tab === id ? COLORS.accent : "transparent", color: tab === id ? "#1A1A1A" : COLORS.textDim }}>
              <span>{icon}</span><span>{label}</span>
              {id === "chat" && unread > 0 && tab !== "chat" && <span className="text-[10px] px-1.5 rounded-full" style={{ background: COLORS.danger, color: "#fff" }}>{unread}</span>}
            </button>
          ))}
        </nav>

        {tab === "zeit" && <PushBanner token={token} />}
        {tab === "zeit" && <ZeitTab {...ctx} />}
        {tab === "schichten" && <SchichtTab {...ctx} />}
        {tab === "aufgaben" && <AufgabenTab {...ctx} />}
        {tab === "checklisten" && <ChecklistenTab {...ctx} />}
        {tab === "chat" && <ChatTab {...ctx} />}
        {tab === "admin" && isAdmin && <AdminTab {...ctx} />}
      </div>

      <nav className="sm:hidden fixed bottom-0 left-0 right-0 flex z-40" style={{ background: COLORS.panel, borderTop: `1px solid ${COLORS.panelBorder}`, paddingBottom: "env(safe-area-inset-bottom)" }}>
        {tabs.map(({ id, label, icon }) => (
          <button key={id} onClick={() => setTab(id)} className="flex-1 flex flex-col items-center py-2 text-[10px] font-medium"
            style={{ color: tab === id ? COLORS.accent : COLORS.textDim }}>
            <span className="text-lg leading-none mb-0.5 relative">{icon}
              {id === "chat" && unread > 0 && tab !== "chat" && <span className="absolute -top-1 -right-2.5 text-[9px] min-w-[16px] h-4 px-1 rounded-full flex items-center justify-center" style={{ background: COLORS.danger, color: "#fff" }}>{unread > 99 ? "99+" : unread}</span>}
            </span>{label}
          </button>
        ))}
      </nav>

      <ReminderAlarm S={S} />
      {authView === "manage" && <AdminManageModal token={token} onClose={() => setAuthView(null)} />}
      {authView === "pin" && <ChangePinModal token={token} onClose={() => setAuthView(null)} />}
    </div>
  );
}

function LoginScreen({ S, offline, onDone, openAdmin }) {
  const [empId, setEmpId] = useState(() => store.get(LAST_EMP_KEY) || "");
  const [pin, setPin] = useState("");
  const [pin2, setPin2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [forceSetup, setForceSetup] = useState(false);
  const list = S.loginEmployees || [];
  useEffect(() => { if (empId && !list.some((e) => e.id === empId)) setEmpId(""); }, [list.length]);
  const selected = list.find((e) => e.id === empId);
  const setup = !!selected && (selected.hasPin === false || forceSetup);
  async function submit() {
    setErr("");
    if (!empId) { setErr("Bitte deinen Namen auswählen."); return; }
    if (setup) {
      if (!/^[0-9A-Za-z]{4,12}$/.test(pin.trim())) { setErr("PIN: 4–12 Ziffern oder Buchstaben."); return; }
      if (pin.trim() !== pin2.trim()) { setErr("Die beiden PINs stimmen nicht überein."); return; }
    }
    setBusy(true);
    try {
      const r = await api(setup ? "/setup-pin" : "/login", { method: "POST", body: { employeeId: empId, pin: pin.trim() } });
      store.set(LAST_EMP_KEY, empId);
      onDone(r);
    } catch (e) {
      if (e.data && e.data.needSetup) { setForceSetup(true); setErr(""); }
      else setErr(e.message);
      setPin(""); setPin2("");
    }
    setBusy(false);
  }
  return (
    <div style={{ background: COLORS.bg, color: COLORS.text, minHeight: "100vh" }} className="font-sans flex items-center justify-center px-4 py-8">
      <div className="w-full max-w-sm">
        <div className="flex flex-col items-center mb-6">
          <img src="/icon-512.png?v=2" alt="" className="w-32 h-32 rounded-full mb-3" />
          <h1 className="text-xl font-semibold">Crew Sport Gefäll</h1>
          <p className="text-sm" style={{ color: COLORS.textDim }}>Team-App · Anmeldung</p>
        </div>
        <LangPicker />
        {offline && <p className="text-xs mb-3 text-center" style={{ color: COLORS.warn }}>Keine Verbindung zum Server.</p>}
        <Panel>
          {list.length === 0 ? (
            <p className="text-sm mb-3" style={{ color: COLORS.textDim }}>
              {S.adminCount === 0 ? "Willkommen! Richte zuerst einen Admin ein und lege danach die Mitarbeiter an." : "Noch keine Mitarbeiter angelegt. Ein Admin muss dich zuerst anlegen."}
            </p>
          ) : (
            <>
              <Field label="Name">
                <Select value={empId} onChange={(v) => { setEmpId(v); setErr(""); setForceSetup(false); setPin(""); setPin2(""); }}>
                  <option value="">Bitte auswählen…</option>
                  {list.map((e) => <option key={e.id} value={e.id}>{e.name}{e.hasPin === false ? " – erste Anmeldung" : ""}</option>)}
                </Select>
              </Field>
              {setup && (
                <div className="text-xs mb-3 px-3 py-2 rounded-lg" style={{ background: COLORS.accent2 + "18", color: COLORS.accent2 }}>
                  👋 Willkommen, {selected.name}! Lege jetzt deine persönliche PIN fest (4–12 Ziffern). Damit meldest du dich ab jetzt an. Bitte nicht deine Bank-PIN verwenden.
                </div>
              )}
              <Field label={setup ? "Neue PIN" : "PIN"}>
                <TextInput type="password" inputMode="numeric" autoComplete={setup ? "new-password" : "current-password"} value={pin} onChange={(e) => setPin(e.target.value)} onKeyDown={(e) => e.key === "Enter" && !setup && submit()} />
              </Field>
              {setup && (
                <Field label="PIN wiederholen">
                  <TextInput type="password" inputMode="numeric" autoComplete="new-password" value={pin2} onChange={(e) => setPin2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} />
                </Field>
              )}
              {err && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{err}</p>}
              <Btn onClick={submit} disabled={busy} className="w-full py-2.5">{setup ? "PIN festlegen & anmelden" : "Anmelden"}</Btn>
              {!setup && <p className="text-[11px] mt-2 text-center" style={{ color: COLORS.textDim }}>PIN vergessen? Ein Admin kann sie dir sagen.</p>}
            </>
          )}
        </Panel>
        <button onClick={openAdmin} className="w-full text-center text-xs mt-4 underline" style={{ color: S.adminCount === 0 ? COLORS.accent : COLORS.textDim }}>
          {S.adminCount === 0 ? "Ersten Admin einrichten" : "🔒 Als Admin anmelden"}
        </button>
      </div>
    </div>
  );
}

function AuthModal({ mode, onDone, onClose }) {
  const [name, setName] = useState("");
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  async function submit() {
    setErr("");
    if (name.trim().length < 2 || pin.trim().length < 4) { setErr("Name (min. 2) und PIN (min. 4 Zeichen) erforderlich."); return; }
    try { onDone(await api(mode === "setup" ? "/admin/setup" : "/admin/login", { method: "POST", body: { name: name.trim(), pin: pin.trim() } })); }
    catch (e) { setErr(e.message); }
  }
  return (
    <Modal onClose={onClose}>
      <h3 className="text-sm font-medium mb-1">{mode === "setup" ? "Ersten Admin einrichten" : "Admin-Login"}</h3>
      {mode === "setup" && <p className="text-xs mb-3" style={{ color: COLORS.textDim }}>Lege deinen Namen und eine PIN (4+ Zeichen) fest.</p>}
      <Field label="Name"><TextInput value={name} onChange={(e) => setName(e.target.value)} autoFocus /></Field>
      <Field label="PIN"><TextInput type="password" inputMode="numeric" value={pin} onChange={(e) => setPin(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} /></Field>
      {err && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{err}</p>}
      <div className="flex gap-2">
        <Btn onClick={submit} className="flex-1">{mode === "setup" ? "Einrichten" : "Einloggen"}</Btn>
        <Btn kind="ghost" onClick={onClose}>Abbrechen</Btn>
      </div>
    </Modal>
  );
}

function ChangePinModal({ token, onClose }) {
  const [oldPin, setOldPin] = useState("");
  const [newPin, setNewPin] = useState("");
  const [newPin2, setNewPin2] = useState("");
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");
  async function save() {
    setErr(""); setMsg("");
    if (newPin.length < 4) { setErr("Neue PIN muss mind. 4 Zeichen haben."); return; }
    if (newPin !== newPin2) { setErr("Die neuen PINs stimmen nicht überein."); return; }
    try { await api("/me/pin", { method: "POST", token, body: { oldPin, newPin } }); setMsg("PIN geändert ✓"); setOldPin(""); setNewPin(""); setNewPin2(""); }
    catch (e) { setErr(e.message); }
  }
  return (
    <Modal onClose={onClose}>
      <h3 className="text-sm font-medium mb-3">Eigene PIN ändern</h3>
      <Field label="Aktuelle PIN"><TextInput type="password" inputMode="numeric" value={oldPin} onChange={(e) => setOldPin(e.target.value)} autoFocus /></Field>
      <Field label="Neue PIN"><TextInput type="password" inputMode="numeric" value={newPin} onChange={(e) => setNewPin(e.target.value)} /></Field>
      <Field label="Neue PIN wiederholen"><TextInput type="password" inputMode="numeric" value={newPin2} onChange={(e) => setNewPin2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && save()} /></Field>
      {err && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{err}</p>}
      {msg && <p className="text-xs mb-2" style={{ color: COLORS.accent2 }}>{msg}</p>}
      <div className="flex gap-2">
        <Btn onClick={save} className="flex-1">Speichern</Btn>
        <Btn kind="ghost" onClick={onClose}>Schließen</Btn>
      </div>
    </Modal>
  );
}

function AdminManageModal({ token, onClose }) {
  const [list, setList] = useState([]);
  const [name, setName] = useState("");
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  useEffect(() => { api("/admin/list", { token }).then((r) => setList(r.admins)).catch((e) => setErr(e.message)); }, []);
  async function add() {
    setErr("");
    try { const r = await api("/admin/add", { method: "POST", token, body: { name: name.trim(), pin: pin.trim() } }); setList(r.admins); setName(""); setPin(""); }
    catch (e) { setErr(e.message); }
  }
  async function remove(id) {
    if (!confirm("Admin wirklich entfernen?")) return;
    try { const r = await api("/admin/" + id, { method: "DELETE", token }); setList(r.admins); } catch (e) { setErr(e.message); }
  }
  return (
    <Modal onClose={onClose}>
      <h3 className="text-sm font-medium mb-3">Admins verwalten</h3>
      <div className="space-y-1.5 mb-3">
        {list.map((a) => (
          <div key={a.id} className="flex items-center justify-between text-sm px-2.5 py-1.5 rounded-lg" style={{ background: COLORS.bg }}>
            <span>{a.name}</span>
            {list.length > 1 && <button onClick={() => remove(a.id)} style={{ color: COLORS.danger }}>🗑</button>}
          </div>
        ))}
      </div>
      <p className="text-xs mb-2" style={{ color: COLORS.textDim }}>Neuen Admin hinzufügen (max. 5):</p>
      <Field label="Name"><TextInput value={name} onChange={(e) => setName(e.target.value)} /></Field>
      <Field label="PIN"><TextInput type="password" value={pin} onChange={(e) => setPin(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} /></Field>
      {err && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{err}</p>}
      <div className="flex gap-2">
        <Btn onClick={add} className="flex-1">Hinzufügen</Btn>
        <Btn kind="ghost" onClick={onClose}>Schließen</Btn>
      </div>
    </Modal>
  );
}

function ZeitTab({ S, me, isAdmin, empAct, activeEmployees }) {
  const [, setTick] = useState(0);
  const [view, setView] = useState("tag");
  const [monday, setMonday] = useState(mondayOf(todayISO()));
  useEffect(() => { const id = setInterval(() => setTick((t) => t + 1), 1000); return () => clearInterval(id); }, []);
  const today = todayISO();

  // Mitarbeiter sehen nur sich selbst. Admin: alle, wer gerade arbeitet zuerst
  const visible = isAdmin ? activeEmployees : activeEmployees.filter((e) => e.id === me);
  const sorted = [...visible].sort((a, b) => {
    const score = (e) => (e.id === me ? 0 : S.timeEntries.some((t) => t.employeeId === e.id && t.end === null) ? 1 : 2);
    return score(a) - score(b) || a.name.localeCompare(b.name);
  });
  const staleOpen = S.timeEntries.filter((e) => e.end === null && e.date < today && (!String(e.employeeId).startsWith("admin:") || e.employeeId === S.myAuthorId));

  return (
    <div>
      <div className="flex items-center justify-between gap-2 mb-4 flex-wrap">
        <Segmented value={view} onChange={setView} options={[{ id: "tag", label: "🗓 Heute" }, { id: "woche", label: "📆 Woche" }]} />
        {view === "woche" && <WeekNav monday={monday} setMonday={setMonday} />}
      </div>

      {staleOpen.length > 0 && (
        <div className="mb-4 px-3 py-2 rounded-lg text-xs" style={{ background: COLORS.warn + "22", border: `1px solid ${COLORS.warn}`, color: COLORS.warn }}>
          ⚠ Nicht ausgestempelt seit Vortag: {staleOpen.map((e) => personName(S, e.employeeId)).join(", ")}.
          {isAdmin ? " Unter 📊 Auswertung → Einträge korrigieren." : " Bitte Admin informieren."}
        </div>
      )}

      {sorted.length === 0 && <Empty>{isAdmin ? "Noch keine Mitarbeiter angelegt." : "Dein Konto ist nicht aktiv."}</Empty>}

      {isAdmin && view === "tag" && S.myAuthorId && (
        <div className="mb-4">
          <h3 className="text-xs uppercase tracking-wider mb-2 flex items-center gap-2" style={{ color: COLORS.accent }}>🔒 Meine Admin-Zeit <span className="normal-case tracking-normal" style={{ color: COLORS.textDim }}>· nur für Admins sichtbar, getrennt ausgewertet</span></h3>
          <div className="grid sm:grid-cols-2 gap-3">
            <ClockCard emp={{ id: S.myAuthorId, name: S.adminName }} S={S} isMe empAct={empAct} today={today} />
            <MyMonthPanel S={S} me={S.myAuthorId} />
          </div>
          {sorted.length > 0 && <h3 className="text-xs uppercase tracking-wider mt-5" style={{ color: COLORS.textDim }}>Mitarbeiter</h3>}
        </div>
      )}

      {view === "tag" ? (
        <div className="grid sm:grid-cols-2 gap-3">
          {sorted.map((emp) => <ClockCard key={emp.id} emp={emp} S={S} isMe={!isAdmin} empAct={empAct} today={today} />)}
          {!isAdmin && me && <MyMonthPanel S={S} me={me} />}
        </div>
      ) : (
        <div className="space-y-3">
          {sorted.map((emp) => {
            const days = weekDays(monday);
            const dayTotals = days.map((d) => dayStats(S, emp.id, d).net);
            const weekTotal = dayTotals.reduce((a, b) => a + b, 0);
            const planned = S.shifts.filter((s) => s.employeeId === emp.id && days.includes(s.date)).reduce((a, s) => a + shiftMs(s), 0);
            const maxDay = Math.max(...dayTotals, 1);
            return (
              <Panel key={emp.id}>
                <div className="flex items-center justify-between mb-3 gap-2">
                  <h3 className="font-medium">{emp.name}</h3>
                  <span className="text-xs text-right" style={{ color: COLORS.textDim }}>
                    Netto {fmtDuration(weekTotal)}
                    {planned > 0 && <> · geplant {fmtDuration(planned)}</>}
                    {emp.weeklyHours ? <> · Soll {emp.weeklyHours}h</> : null}
                  </span>
                </div>
                <div className="grid grid-cols-7 gap-1.5">
                  {days.map((d, i) => (
                    <div key={d} className="flex flex-col items-center gap-1">
                      <div className="w-full rounded-md flex items-end" style={{ height: 56, background: COLORS.bg }}>
                        <div className="w-full rounded-md" style={{ height: `${dayTotals[i] > 0 ? Math.max((dayTotals[i] / maxDay) * 100, 8) : 0}%`, background: d === today ? COLORS.accent : COLORS.accent2 }} />
                      </div>
                      <span className="text-[10px]" style={{ color: COLORS.textDim }}>{fmtDateShort(d).split(",")[0]}</span>
                      <span className="text-[10px]" style={{ color: COLORS.textDim }}>{dayTotals[i] > 0 ? fmtHours(dayTotals[i]) : "–"}</span>
                    </div>
                  ))}
                </div>
              </Panel>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MyMonthPanel({ S, me }) {
  const ym = todayISO().slice(0, 7);
  const entries = S.timeEntries.filter((e) => e.employeeId === me && e.date.startsWith(ym));
  const st = rangeStats(S, me, entries.map((e) => e.date));
  const net = st.net, days = st.days;
  const planned = S.shifts.filter((s) => s.employeeId === me && s.date.startsWith(ym)).reduce((a, s) => a + shiftMs(s), 0);
  return (
    <Panel>
      <h3 className="text-sm font-medium mb-2">Mein {fmtMonth(ym)}</h3>
      <div className="grid grid-cols-3 gap-2 text-center">
        <div className="rounded-lg py-2" style={{ background: COLORS.bg }}><div className="text-lg font-semibold tabular-nums">{fmtHours(net)}</div><div className="text-[11px]" style={{ color: COLORS.textDim }}>Std. netto</div></div>
        <div className="rounded-lg py-2" style={{ background: COLORS.bg }}><div className="text-lg font-semibold tabular-nums">{days}</div><div className="text-[11px]" style={{ color: COLORS.textDim }}>Arbeitstage</div></div>
        <div className="rounded-lg py-2" style={{ background: COLORS.bg }}><div className="text-lg font-semibold tabular-nums">{planned ? fmtHours(planned) : "–"}</div><div className="text-[11px]" style={{ color: COLORS.textDim }}>Std. geplant</div></div>
      </div>
    </Panel>
  );
}

function ClockCard({ emp, S, isMe, empAct, today }) {
  const running = S.timeEntries.find((e) => e.employeeId === emp.id && e.end === null);
  const paused = onBreak(running);
  const todays = S.timeEntries.filter((e) => e.employeeId === emp.id && e.date === today).sort((a, b) => b.start - a.start);
  const ds = dayStats(S, emp.id, today);
  const net = ds.net, brk = ds.brk, lunch = ds.lunch;
  const shift = S.shifts.filter((s) => s.employeeId === emp.id && s.date === today).sort((a, b) => a.start.localeCompare(b.start))[0];
  const [loc, setLoc] = useState(shift && shift.location ? shift.location : "");
  const [busy, setBusy] = useState(false);
  const go = async (path, body) => { setBusy(true); try { await empAct(emp.id, path, body); } finally { setBusy(false); } };
  const openBreak = running && (running.breaks || []).find((b) => b.end === null);
  const needsBreakHint = !(S.lunch && S.lunch.enabled) && running && !paused && entryNetMs(running) > 6 * 3600000 && entryBreakMs(running) < 30 * 60000;

  const status = !running
    ? { text: "Nicht eingestempelt", color: COLORS.textDim }
    : paused
      ? { text: `Pause seit ${fmtClock(openBreak.start)}`, color: COLORS.warn }
      : { text: `Arbeitet seit ${fmtClock(running.start)}`, color: COLORS.accent2 };

  return (
    <Panel style={isMe ? { borderColor: COLORS.accent2 } : {}}>
      <div className="flex items-start justify-between mb-1 gap-2">
        <div>
          <h3 className="font-medium">{emp.name}</h3>
          <p className="text-xs flex items-center gap-1.5" style={{ color: status.color }}>
            {running && <span className={`inline-block w-2 h-2 rounded-full ${paused ? "" : "pulse"}`} style={{ background: status.color }} />}
            {status.text}
          </p>
        </div>
        <div className="text-right">
          <div className="text-lg font-semibold tabular-nums">{fmtDuration(net)}</div>
          <div className="text-[11px]" style={{ color: COLORS.textDim }}>netto heute{brk > 0 && ` · Pause ${Math.round(brk / 60000)} Min`}{lunch > 0 && ` · 🍽 ${Math.round(lunch / 60000)} Min Mittag`}</div>
        </div>
      </div>
      {shift && (
        <p className="text-xs mb-2 flex items-center gap-1.5 flex-wrap" style={{ color: COLORS.textDim }}>📅 Schicht {shift.start}–{shift.end} <LocTag loc={shift.location} /></p>
      )}
      {running && running.location && <p className="text-xs mb-2 flex items-center gap-1.5" style={{ color: COLORS.textDim }}>📍 Eingestempelt bei <LocTag loc={running.location} /></p>}
      {needsBreakHint && <p className="text-xs mb-2" style={{ color: COLORS.warn }}>Über 6 h ohne 30 Min Pause – bitte Pause machen.</p>}

      {!running ? (
        <div className="flex gap-2 mt-2">
          <Select value={loc} onChange={setLoc} className="flex-1 text-sm">
            <option value="">Standort…</option>
            {S.locations.map((l) => <option key={l} value={l}>{l}</option>)}
          </Select>
          <Btn kind="go" disabled={busy} onClick={() => go("/time/clockin", { location: loc || null })} className="px-5">▶ Start</Btn>
        </div>
      ) : (
        <div className="flex gap-2 mt-2">
          <Btn kind={paused ? "go" : "warn"} disabled={busy} onClick={() => go("/time/pause")} className="flex-1">{paused ? "▶ Weiter" : "⏸ Pause"}</Btn>
          <Btn kind="danger" disabled={busy} onClick={() => go("/time/clockout")} className="flex-1">■ Ende</Btn>
        </div>
      )}

      {todays.length > 0 && (
        <div className="space-y-1 mt-3 max-h-32 overflow-y-auto scrollbar-thin">
          {todays.map((e) => (
            <div key={e.id} className="flex items-center justify-between text-xs px-2.5 py-1.5 rounded-lg" style={{ background: COLORS.bg }}>
              <span style={{ color: COLORS.textDim }}>{fmtClock(e.start)} – {e.end ? fmtClock(e.end) : "läuft"}{entryBreakMs(e) > 0 && ` · ${Math.round(entryBreakMs(e) / 60000)}′ Pause`}</span>
              <span className="tabular-nums">{fmtDuration(entryNetMs(e))}</span>
            </div>
          ))}
        </div>
      )}
    </Panel>
  );
}

const WD_SHORT = ["MO", "DI", "MI", "DO", "FR", "SA", "SO"];
// Excel-Farben: 1. Standort gelb, 2. Standort grün, frei rot
const DIENST_COLORS = [{ bg: "#F2D23C", fg: "#1A1A1A" }, { bg: "#6B8E4E", fg: "#fff" }, { bg: "#6FA8DC", fg: "#10202E" }, { bg: "#B48EDB", fg: "#1A1A1A" }, { bg: "#E8A33D", fg: "#1A1A1A" }];
const FREI_COLOR = { bg: "#D9473F", fg: "#fff" };
function dienstColor(S, loc) { const i = (S.locations || []).indexOf(loc); return DIENST_COLORS[i < 0 ? 0 : i % DIENST_COLORS.length]; }
function shortLoc(l) { return !l ? "" : l.length > 7 ? l.slice(0, 4) : l; }
const fmtDM = (iso) => iso.slice(8, 10) + "." + iso.slice(5, 7) + ".";

// Excel-Wert (Text "Haupt", "Grün", "Frei" …) einem Standort zuordnen. null = frei, undefined = unbekannt
function matchLocText(S, v) {
  const t = String(v == null ? "" : v).trim().toLowerCase();
  if (!t || /^(frei|f|-|–|x|off|0|urlaub|krank)$/.test(t)) return null;
  const L = S.locations || [];
  return L.find((x) => x.toLowerCase() === t) || L.find((x) => x.toLowerCase().startsWith(t.slice(0, 4))) || L.find((x) => t.includes(x.toLowerCase().slice(0, 4)));
}
function homeOf(S, e, days) {
  if (e.home && (S.locations || []).includes(e.home)) return e.home;
  const cnt = {};
  S.shifts.filter((s) => s.employeeId === e.id && days.includes(s.date) && s.location).forEach((s) => { cnt[s.location] = (cnt[s.location] || 0) + 1; });
  const best = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  return best || (S.locations || [])[0] || "";
}

// Name im Dienstplan ändern: aus der Mitarbeiterliste wählen (wie beim Einsteigen) oder umbenennen, Filiale wechseln
function DienstNameModal({ S, emp, act, groupLoc, onClose }) {
  const [name, setName] = useState(emp.name);
  const [other, setOther] = useState("");
  const [err, setErr] = useState("");
  const L = S.locations || [];
  async function save() {
    setErr("");
    try {
      if (other) {
        // Dienste dieser Zeile auf den gewählten Mitarbeiter übertragen
        await act("/shifts/reassign", { method: "POST", body: { from: emp.id, to: other } });
      } else if (name.trim() && name.trim() !== emp.name) {
        await act("/employees/" + emp.id, { method: "PATCH", body: { name: name.trim() } });
      }
      onClose();
    } catch (e) { setErr(e.message); }
  }
  async function move(loc) { try { await act("/employees/" + emp.id, { method: "PATCH", body: { home: loc } }); onClose(); } catch (e) { setErr(e.message); } }
  return (
    <Modal onClose={onClose}>
      <h3 className="text-sm font-medium mb-3">Mitarbeiter im Dienstplan</h3>
      <Field label="Filiale">
        <div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${L.length}, minmax(0, 1fr))` }}>
          {L.map((l) => { const c = dienstColor(S, l); const on = l === groupLoc; return (
            <button key={l} onClick={() => move(l)} className="rounded-lg py-2 text-sm font-semibold" translate="no"
              style={{ background: on ? c.bg : "transparent", color: on ? c.fg : c.bg, border: `2px solid ${c.bg}` }}>{l}</button>
          ); })}
        </div>
      </Field>
      <Field label="Name ändern">
        <TextInput value={name} onChange={(e) => { setName(e.target.value); setOther(""); }} />
      </Field>
      <Field label="…oder ist das jemand aus der Liste? (Dienste werden übertragen)">
        <Select value={other} onChange={setOther}>
          <option value="">– nein –</option>
          {S.employees.filter((x) => x.id !== emp.id).map((x) => <option key={x.id} value={x.id}>{x.name}</option>)}
        </Select>
      </Field>
      {err && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{err}</p>}
      <div className="flex gap-2">
        <Btn onClick={save} className="flex-1">Speichern</Btn>
        <Btn kind="ghost" onClick={onClose}>Abbrechen</Btn>
      </div>
    </Modal>
  );
}

// ---------- Excel-Import ----------
// Kleiner .xlsx-Leser direkt im Browser (xlsx = ZIP mit XML), ohne Zusatz-Bibliothek
async function readXlsx(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Keine gültige .xlsx-Datei (bitte als .xlsx speichern).");
  const files = {}; let p = dv.getUint32(eocd + 16, true);
  for (let n = dv.getUint16(eocd + 10, true); n > 0; n--) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    files[name] = { method, csize, off }; p += 46 + nl + xl + cl;
  }
  async function get(name) {
    const f = files[name]; if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const raw = u8.subarray(start, start + f.csize);
    if (f.method === 0) return new TextDecoder().decode(raw);
    if (typeof DecompressionStream === "undefined") throw new Error("Dieser Browser kann .xlsx nicht lesen – bitte die Tabelle kopieren und einfügen.");
    const ds = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return await new Response(ds).text();
  }
  const xml = (t) => new DOMParser().parseFromString(t, "application/xml");
  const ss = []; const sst = await get("xl/sharedStrings.xml");
  if (sst) xml(sst).querySelectorAll("si").forEach((si) => ss.push([...si.getElementsByTagName("t")].map((t) => t.textContent).join("")));
  let sheet = "xl/worksheets/sheet1.xml";
  try {
    const wb = xml(await get("xl/workbook.xml")), rels = xml(await get("xl/_rels/workbook.xml.rels"));
    const first = wb.getElementsByTagName("sheet")[0];
    const rid = first.getAttribute("r:id") || first.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
    const rel = [...rels.getElementsByTagName("Relationship")].find((r) => r.getAttribute("Id") === rid);
    if (rel) { const t = rel.getAttribute("Target"); sheet = t.startsWith("/") ? t.slice(1) : "xl/" + t; }
  } catch (e) {}
  const doc = xml(await get(sheet) || "");
  const grid = [];
  const colNum = (ref) => { let n = 0; for (const ch of ref.replace(/\d+/g, "")) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  [...doc.getElementsByTagName("c")].forEach((c) => {
    const ref = c.getAttribute("r"); const r = parseInt(ref.replace(/[A-Z]+/g, ""), 10) - 1, col = colNum(ref);
    const t = c.getAttribute("t"); const v = c.getElementsByTagName("v")[0];
    let val = "";
    if (t === "s") val = ss[+v.textContent] || "";
    else if (t === "inlineStr") val = [...c.getElementsByTagName("t")].map((x) => x.textContent).join("");
    else if (v) val = t === "str" || t === "b" ? v.textContent : (isNaN(+v.textContent) ? v.textContent : +v.textContent);
    (grid[r] = grid[r] || [])[col] = val;
  });
  return Array.from(grid, (row) => Array.from(row || [], (x) => (x === undefined ? "" : x)));
}
function cellToISO(v) {
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, "0")}-${String(v.getDate()).padStart(2, "0")}`;
  if (typeof v === "number" && v > 30000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
  const t = String(v == null ? "" : v).trim();
  let m = t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; }
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
// Liest das Raster: Kopfzeile MO…SO, darunter Datumszeile, Blöcke je Filiale, Mitarbeiterzeilen
function parseDienstplan(S, grid, fallbackMonday) {
  const out = new Map(); const warnings = []; let dayCols = null, dates = {}, home = null;
  const txt = (v) => String(v == null ? "" : v).trim();
  // Passt das Datum nicht zum Wochentag (z. B. Tippfehler im Jahr), passendes Jahr daneben suchen
  const fixWd = (iso, w) => {
    if (!iso) return iso;
    const wdOf = (x) => (parseISO(x).getDay() + 6) % 7;
    if (wdOf(iso) === w) return iso;
    for (const dy of [1, -1]) { const alt = String(+iso.slice(0, 4) + dy) + iso.slice(4); if (wdOf(alt) === w) { if (!warnings.some((x) => x.startsWith("📅"))) warnings.push(`📅 Datum ${iso.slice(8, 10)}.${iso.slice(5, 7)}.${iso.slice(0, 4)} passt nicht zum Wochentag – als ${alt.slice(0, 4)} übernommen`); return alt; } }
    return iso;
  };
  for (let r = 0; r < grid.length; r++) {
    const row = grid[r] || [];
    const wd = row.map((v) => { const t = txt(v).toLowerCase(); return /^(mo|di|mi|do|fr|sa|so)(ntag|nstag|ttwoch|nnerstag|eitag|mstag|nntag)?\.?$/.test(t) ? ["mo", "di", "mi", "do", "fr", "sa", "so"].indexOf(t.slice(0, 2)) : -1; });
    if (wd.filter((x) => x >= 0).length >= 5) {
      dayCols = []; dates = {};
      wd.forEach((w, c) => { if (w >= 0) dayCols.push({ c, w }); });
      dayCols.forEach(({ c, w }) => { const iso = fixWd(cellToISO(row[c]), w); if (iso) dates[c] = iso; }); // Datum evtl. in derselben Zeile
      continue;
    }
    if (!dayCols) continue;
    const isoRow = dayCols.map(({ c }) => cellToISO(row[c]));
    if (isoRow.filter(Boolean).length >= 3 && !txt(row[0])) { dayCols.forEach(({ c, w }, i) => { if (isoRow[i]) dates[c] = fixWd(isoRow[i], w); }); continue; }
    const name = txt(row[0]);
    if (!name) continue;
    if (/^legende/i.test(name)) { dayCols = null; continue; }
    const vals = dayCols.map(({ c }) => txt(row[c]));
    if (vals.every((v) => v === "")) continue;
    // Filial-Überschrift (z. B. „Hauptfiliale“ mit Anzahl)
    if (vals.every((v) => v === "" || /^\d+$/.test(v) || v.startsWith("="))) { const l = matchLocText(S, name.replace(/filiale/i, "")) ; home = l || home; continue; }
    const cells = [];
    dayCols.forEach(({ c, w }, i) => {
      const date = dates[c] || addDays(fallbackMonday, w);
      const loc = matchLocText(S, vals[i]);
      if (loc === undefined) { warnings.push(`${name}: „${vals[i]}“ unbekannt – als frei übernommen`); cells.push({ date, location: null }); }
      else cells.push({ date, location: loc });
    });
    const key = name.toLowerCase();
    if (out.has(key)) out.get(key).cells.push(...cells); else out.set(key, { name, home, cells });
  }
  return { rows: [...out.values()], warnings };
}
// Namen aus Excel den Mitarbeitern zuordnen – auch bei Kurzformen („Basti“ = „Bastian Seitlinger“) oder Doppelnamen
function findEmployee(S, name) {
  const tok = (x) => x.toLowerCase().replace(/[^a-zäöüßáéíóúčšžćđ ]/g, " ").split(/\s+/).filter((t) => t.length >= 2);
  const sim = (a, b) => { if (a === b) return 3; let i = 0; while (i < a.length && a[i] === b[i]) i++; return i >= 4 ? 2 : 0; };
  const nt = tok(name);
  const scored = S.employees.map((e) => { const et = tok(e.name); return { e, sc: nt.reduce((s, t) => s + Math.max(0, ...et.map((u) => sim(t, u))), 0) }; }).sort((a, b) => b.sc - a.sc);
  if (!scored.length || scored[0].sc < 2 || (scored[1] && scored[1].sc === scored[0].sc)) return null;
  return scored[0].e;
}

function DienstImportModal({ S, act, monday, onClose, onDone }) {
  const [text, setText] = useState("");
  const [parsed, setParsed] = useState(null);
  const [map, setMap] = useState({});
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  function useGrid(grid) {
    const p = parseDienstplan(S, grid, monday);
    if (!p.rows.length) { setErr("Keine Dienstplan-Zeilen gefunden. Bitte die Tabelle inkl. Kopfzeile (MO … SO) kopieren."); setParsed(null); return; }
    setErr(""); setParsed(p);
    const m = {}; p.rows.forEach((r) => { const e = findEmployee(S, r.name); m[r.name] = e ? e.id : "__new"; }); setMap(m);
  }
  function fromText(t) { setText(t); if (t.trim()) useGrid(t.replace(/\r/g, "").split("\n").map((l) => l.split(l.includes("\t") ? "\t" : ";"))); else setParsed(null); }
  async function fromFile(f) {
    if (!f) return;
    setErr(""); setBusy(true);
    try {
      if (/\.csv$/i.test(f.name)) fromText(await f.text());
      else useGrid(await readXlsx(await f.arrayBuffer()));
    } catch (e) { setErr(e.message || "Datei konnte nicht gelesen werden."); }
    setBusy(false);
  }
  const allDates = parsed ? [...new Set(parsed.rows.flatMap((r) => r.cells.map((c) => c.date)))].sort() : [];
  async function save() {
    setBusy(true);
    try {
      const rows = parsed.rows.filter((r) => map[r.name] !== "__skip").map((r) => map[r.name] === "__new" ? { create: true, name: r.name, home: r.home, cells: r.cells } : { employeeId: map[r.name], home: r.home, cells: r.cells });
      const res = await act("/shifts/import", { method: "POST", body: { rows } });

          <div className="overflow-x-auto scrollbar-thin mb-3 rounded-lg" style={{ border: `1px solid ${COLORS.panelBorder}` }}>
            <table className="text-[11px] border-collapse w-full" style={{ minWidth: 520 }}>

                      <select value={map[r.name]} onChange={(e) => setMap({ ...map, [r.name]: e.target.value })} className="w-full mt-0.5 px-1 py-0.5 rounded text-[11px]" style={inputStyle}>
                        <option value="__new">➕ neu anlegen</option>

const ABS = {
  urlaub: { icon: "🏖", label: "Urlaub", color: "#6FA8DC" },
  krank: { icon: "🤒", label: "Krank", color: "#D5694B" },
  sonstiges: { icon: "📌", label: "Abwesend", color: "#B48EDB" },
  abwesend: { icon: "🚫", label: "Abwesend", color: "#8C919E" },
};
const ABS_STATUS = { offen: "beantragt", genehmigt: "genehmigt", abgelehnt: "abgelehnt" };
const absCovers = (a, d) => a.from <= d && a.to >= d;
// Abwesenheitstage innerhalb eines Monats (Kalendertage, nur genehmigt)
function absDaysInMonth(S, empId, ym, type) {
  const days = monthDays(ym);
  return days.filter((d) => (S.absences || []).some((a) => a.employeeId === empId && a.type === type && a.status === "genehmigt" && absCovers(a, d))).length;
}
function fmtRange(a) { return a.from === a.to ? fmtDateShort(a.from) : `${fmtDateShort(a.from)} – ${fmtDateShort(a.to)}`; }

function AbsenceModal({ S, isAdmin, act, onClose, initType }) {
  const [f, setF] = useState({ type: initType || "urlaub", from: todayISO(), to: todayISO(), note: "", employeeId: isAdmin ? ((S.employees.find((e) => e.active) || {}).id || "") : "" });

  async function save() {
    setErr("");

    catch (e) { setErr(e.message); }

  const title = isAdmin ? "Abwesenheit eintragen" : f.type === "krank" ? "🤒 Krank melden" : f.type === "urlaub" ? "🏖 Urlaub beantragen" : "📌 Abwesenheit melden";

      )}
      {f.type === "krank" && (
        <div className="mb-3 px-3 py-2.5 rounded-lg text-sm font-semibold" style={{ background: COLORS.danger + "22", border: `1px solid ${COLORS.danger}`, color: COLORS.danger }}>
          ⚠️ Krankmeldung erforderlich
        </div>
      )}
      <Field label="Art">
        <Select value={f.type} onChange={set("type")}><option value="urlaub">🏖 Urlaub</option><option value="krank">🤒 Krank</option><option value="sonstiges">📌 Sonstiges (z. B. Arzt, Schule)</option></Select>
      </Field>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Von"><TextInput type="date" value={f.from} onChange={(e) => setF((p) => ({ ...p, from: e.target.value, to: p.to < e.target.value ? e.target.value : p.to }))} /></Field>
        <Field label="Bis"><TextInput type="date" value={f.to} onChange={set("to")} /></Field>
      </div>
      <Field label="Notiz (optional)"><TextInput value={f.note} onChange={set("note")} placeholder={f.type === "krank" ? "z. B. voraussichtlich bis Freitag" : "optional"} /></Field>
      {!isAdmin && <p className="text-[11px] mb-3" style={{ color: COLORS.textDim }}>{f.type === "krank" ? "Die Krankmeldung gilt sofort, die Admins werden benachrichtigt. Kollegen sehen nur „abwesend“." : "Der Antrag geht an die Admins zur Freigabe. Du bekommst Bescheid, sobald er bearbeitet wurde."}</p>}
      {err && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{err}</p>}
      <div className="flex gap-2">
        <Btn onClick={save} className="flex-1">{isAdmin ? "Eintragen" : f.type === "urlaub" ? "Beantragen" : "Melden"}</Btn>
        <Btn kind="ghost" onClick={onClose}>Abbrechen</Btn>
      </div>
    </Modal>
  );
}

            {mine.map((a) => (
              <div key={a.id} className="flex items-center justify-between gap-2 text-xs px-2.5 py-2 rounded-lg" style={{ background: COLORS.bg }}>
                <span>{ABS[a.type].icon} {ABS[a.type].label} · {fmtRange(a)}</span>

                  <span style={{ color: a.status === "genehmigt" ? COLORS.accent2 : a.status === "abgelehnt" ? COLORS.danger : COLORS.warn }}>{a.type === "krank" && a.status === "genehmigt" ? "gemeldet" : ABS_STATUS[a.status]}</span>
                  {(a.status === "offen" || a.type === "krank") && <button onClick={() => remove(a)} style={{ color: COLORS.textDim }}>🗑</button>}

const IDEA_STATUS = {
